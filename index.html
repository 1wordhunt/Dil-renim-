<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch | Auto-Match Test</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #5865F2; --bg: #ffffff; --text: #2e3338; --grad: linear-gradient(135deg, #62ACFC 0%, #BA75FF 100%); }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Ekranlar */
        .screen { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        /* Video Alanı */
        .video-wrapper { width: 100%; max-width: 400px; display: grid; grid-template-rows: 1fr 1fr; gap: 10px; flex: 1; margin: 20px 0; }
        video { width: 100%; height: 100%; background: #000; border-radius: 15px; object-fit: cover; border: 2px solid #eee; }

        /* UI Elemanları */
        input { width: 80%; padding: 15px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 10px; }
        .btn { background: var(--grad); color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 80%; }
        
        /* Dükkan Overlay */
        #shopOverlay { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(255,255,255,0.95); z-index:100; flex-direction:column; align-items:center; justify-content:center;
        }
        .shop-item { border: 1px solid #ddd; padding: 20px; border-radius: 15px; margin: 10px; width: 150px; text-align: center; }
    </style>
</head>
<body>

<div id="authScreen" class="screen active">
    <h1>LangMatch</h1>
    <input type="text" id="username" placeholder="Username (e.g. Alex)">
    <button class="btn" onclick="startApp()">JOIN APP</button>
</div>

<div id="mainScreen" class="screen">
    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px;">
        <div id="userInfo"><b>Dev:</b> <span id="uName"></span></div>
        <div>💰 <span id="coins">500</span></div>
    </div>

    <div class="video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video> <video id="localVideo" autoplay muted playsinline></video> </div>

    <div id="status" style="margin-bottom: 10px; font-weight: bold; color: var(--primary);">Ready to match...</div>
    
    <button class="btn" id="matchBtn" onclick="findRandomMatch()">START RANDOM MATCH</button>
    
    <div style="margin-top: 20px; display: flex; gap: 20px;">
        <button onclick="toggleShop()" style="background:none; border:none; cursor:pointer; font-weight:bold;">🛒 SHOP</button>
        <button style="background:none; border:none; cursor:pointer; font-weight:bold;">👤 PROFILE</button>
    </div>
</div>

<div id="shopOverlay">
    <h2>SHOP</h2>
    <div style="display: flex;">
        <div class="shop-item">
            <p>Golden Frame</p>
            <button class="btn" onclick="buy(200)">200 💰</button>
        </div>
        <div class="shop-item">
            <p>Blue Diamond</p>
            <button class="btn" onclick="buy(500)">500 💰</button>
        </div>
    </div>
    <button class="btn" style="margin-top: 20px; background: #333;" onclick="toggleShop()">CLOSE</button>
</div>

<script>
    let myPeer;
    let myStream;
    let coins = 500;

    async function startApp() {
        const name = document.getElementById('username').value;
        if(!name) return alert("Enter name!");
        document.getElementById('uName').innerText = name;
        
        document.getElementById('authScreen').classList.remove('active');
        document.getElementById('mainScreen').classList.add('active');

        // Kamerayı aç
        myStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVideo').srcObject = myStream;

        // PeerJS Başlat - Basit bir oda mantığı için ID'yi "langmatch-room-" ile başlatıyoruz
        // Gerçek uygulamada rastgele ID olur, biz test için özel bir havuz oluşturuyoruz
        myPeer = new Peer(); 

        myPeer.on('call', (call) => {
            document.getElementById('status').innerText = "Connected!";
            call.answer(myStream);
            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });
        });
    }

    function findRandomMatch() {
        document.getElementById('status').innerText = "Searching for someone...";
        // Bu kısım normalde Backend ile yapılır. 
        // Test için: Sen Manuel olarak diğer cihazın ID'sini sormak yerine 
        // ekrana gelen ID'yi kopyalayıp diğerine yazmalısın.
        // Ama otomatik olsun dersen:
        let partnerId = prompt("Partner ID'sini gir (Test için diğer cihazdaki ID'yi buraya yaz):");
        if(partnerId) {
            const call = myPeer.call(partnerId, myStream);
            call.on('stream', (remoteStream) => {
                document.getElementById('status').innerText = "Connected!";
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });
        }
    }

    function toggleShop() {
        const shop = document.getElementById('shopOverlay');
        shop.style.display = (shop.style.display === 'flex') ? 'none' : 'flex';
    }

    function buy(price) {
        if(coins >= price) {
            coins -= price;
            document.getElementById('coins').innerText = coins;
            alert("Bought! Remaining: " + coins);
        } else {
            alert("No coins!");
        }
    }
</script>

</body>
</html>
