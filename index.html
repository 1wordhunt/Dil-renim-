<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch | Pro Developer</title>
    <style>
        :root {
            --bg: #0f1015;
            --card-bg: #1a1b23;
            --text-main: #ffffff;
            --text-dim: #a0a0ab;
            --neon-red: linear-gradient(135deg, #ff416c, #ff4b2b);
            --neon-green: linear-gradient(135deg, #00b09b, #96c93d);
            --neon-blue: linear-gradient(135deg, #2193b0, #6dd5ed);
            --neon-yellow: linear-gradient(135deg, #f12711, #f5af19);
            --neon-purple: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            gap: 15px;
        }

        /* ÜST PROFİL BARI */
        .header-pro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar-frame {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 2px solid #f5af19;
            padding: 2px;
            background: linear-gradient(to bottom, #f5af19, #f12711);
        }
        .avatar-frame img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* DAILY QUEST BANNER */
        .daily-quest {
            background: var(--neon-purple);
            padding: 15px;
            border-radius: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 20px rgba(106, 17, 203, 0.3);
        }

        /* ANA BUTONLAR (GRID) */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-large {
            grid-column: span 2;
            height: 120px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 18px;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-half {
            height: 160px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            gap: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        /* RENKLER VE GÖLGELER */
        .global-chat { background: var(--neon-red); box-shadow: 0 8px 15px rgba(255, 65, 108, 0.4); }
        .matching { background: var(--neon-green); box-shadow: 0 8px 15px rgba(0, 176, 155, 0.4); }
        .shop { background: var(--neon-yellow); box-shadow: 0 8px 15px rgba(241, 39, 17, 0.4); }
        .telaffuz { background: var(--neon-blue); box-shadow: 0 8px 15px rgba(33, 147, 176, 0.4); }
        .uye-ara { background: var(--card-bg); border: 1px solid #444; }

        .btn-large:active, .btn-half:active { transform: scale(0.95); }

        .icon-img { width: 45px; margin-bottom: 8px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
        
        .badge-count {
            position: absolute; top: 15px; right: 20px;
            background: #fff; color: #ff416c;
            padding: 2px 8px; border-radius: 10px; font-size: 12px;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 420px;
            background: rgba(26, 27, 35, 0.95);
            display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid #333;
            backdrop-filter: blur(10px);
        }
        .nav-item { color: var(--text-dim); font-size: 11px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--blue); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-pro">
        <div class="user-info">
            <div class="avatar-frame">
                <img src="https://via.placeholder.com/100" alt="User">
            </div>
            <div>
                <div style="font-size: 14px; font-weight: bold;">User: Alex</div>
                <div style="font-size: 11px; color: #f5af19;">🥇 Gold - 9,480 XP</div>
            </div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: bold; color: #ffd60a;">💰 12,500</div>
            <div style="font-size: 11px; color: #00d2ff;">💎 350</div>
        </div>
    </div>

    <div class="daily-quest">
        <div>
            <div style="font-size: 11px; opacity: 0.8;">🏆 DAILY QUEST</div>
            <div style="font-size: 14px; font-weight: bold;">Bugün 5 farklı kişiyle eşleş!</div>
        </div>
        <div style="font-size: 24px;">🧭</div>
    </div>

    <div class="main-grid">
        <button class="btn-large global-chat">
            <div class="badge-count">99+</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2462/2462719.png" class="icon-img">
            GLOBAL CHAT
        </button>

        <button class="btn-half matching">
            <img src="https://cdn-icons-png.flaticon.com/512/3221/3221803.png" class="icon-img">
            MATCHING
        </button>

        <button class="btn-half shop">
            <img src="https://cdn-icons-png.flaticon.com/512/3081/3081840.png" class="icon-img">
            SHOP
        </button>

        <button class="btn-half telaffuz">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="icon-img">
            TELAFFUZ
        </button>

        <button class="btn-half uye-ara">
            <img src="https://cdn-icons-png.flaticon.com/512/954/954591.png" class="icon-img">
            ÜYE ARA
        </button>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">🏠<br>HOME</div>
        <div class="nav-item">🛒<br>SHOP</div>
        <div class="nav-item">✅<br>TASKS</div>
        <div class="nav-item">👤<br>PROFILE</div>
    </div>
</div>

</body>
</html>
