<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v29 | Final Build</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000; --accent: #66fcf1; --gold: #f5af19; --red: #ff3b5c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; }
        .active { display: flex !important; }
        
        /* Auth & Card */
        .card { width: 85%; max-width: 400px; padding: 25px; background: rgba(255,255,255,0.05); border-radius: 25px; border: 1px solid var(--accent); margin: auto; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        /* Video Area */
        .video-container { flex: 1; position: relative; background: #111; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 110px; height: 150px; position: absolute; top: 20px; right: 20px; border: 2px solid var(--accent); border-radius: 12px; transform: scaleX(-1); object-fit: cover; z-index: 10; }
        
        .ui-overlay { position: absolute; bottom: 30px; width: 100%; text-align: center; z-index: 11; }
        .timer-box { font-size: 30px; color: var(--red); font-weight: bold; margin-bottom: 15px; text-shadow: 2px 2px #000; }

        /* Leaderboard */
        .rank-item { display: flex; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.1); margin: 5px 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div class="card">
        <h2 style="color:var(--accent)">NEXUS CONNECT</h2>
        <div id="authBox">
            <input type="email" id="email" placeholder="E-posta">
            <input type="password" id="pass" placeholder="Şifre (Min. 6 Karakter)">
            <div id="regFields" style="display:none;">
                <input type="text" id="username" placeholder="Kullanıcı Adı">
                <select id="gender">
                    <option value="Erkek">Erkek</option>
                    <option value="Kadın">Kadın</option>
                </select>
            </div>
            <button class="btn-main" onclick="processAuth()" id="authBtn">GİRİŞ YAP</button>
            <p onclick="toggleMode()" id="toggleTxt" style="color:var(--gold); cursor:pointer; margin-top:15px; font-size:13px;">Hesabın yok mu? Kayıt Ol</p>
        </div>
    </div>
</div>

<div id="screenHome" class="screen">
    <div style="padding:20px; display:flex; justify-content:space-between; align-items:center; background:#111;">
        <div>👤 <b id="uDisplay">...</b></div>
        <div style="color:var(--gold)">💰 <span id="uCoins">0</span> | ⭐ <span id="uXP">0</span></div>
    </div>
    <div style="padding:20px; flex:1; display:flex; flex-direction:column; justify-content:center; gap:15px;">
        <button class="btn-main" style="height:120px; background:#2ecc71; font-size:18px;" onclick="startMatching()">📹 GERÇEK EŞLEŞME BAŞLAT</button>
        <button class="btn-main" style="background:#3498db" onclick="openScreen('screenLeaderboard')">🏆 DÜNYA SIRALAMASI</button>
        <button class="btn-main" style="background:var(--red)" onclick="location.reload()">ÇIKIŞ YAP</button>
    </div>
</div>

<div id="screenMatching" class="screen">
    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="ui-overlay">
            <div class="timer-box" id="matchTime">60</div>
            <p id="statusTxt">Bağlantı Aranıyor...</p>
            <div style="display:flex; justify-content:center; gap:10px;">
                <button class="btn-main" style="width:120px; background:var(--gold)" onclick="addTime()">+30s (30💰)</button>
                <button class="btn-main" style="width:120px; background:var(--red)" onclick="closeMatch()">AYRIL</button>
            </div>
        </div>
    </div>
</div>

<div id="screenLeaderboard" class="screen">
    <div style="padding:20px; background:#111; display:flex; align-items:center;">
        <span onclick="openScreen('screenHome')" style="cursor:pointer; font-size:20px;">⬅️</span>
        <b style="margin-left:20px;">TOP 10 AKTİFLİK</b>
    </div>
    <div id="rankContainer"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get, update, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        storageBucket: "nexus-b73be.firebasestorage.app",
        messagingSenderId: "364035825759",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let isReg = false;
    let userData = null;
    let peer = null;
    let localStream = null;
    let countdown = null;

    // --- AUTH MANTIĞI ---
    window.toggleMode = () => {
        isReg = !isReg;
        document.getElementById('regFields').style.display = isReg ? 'block' : 'none';
        document.getElementById('authBtn').innerText = isReg ? 'KAYIT OL' : 'GİRİŞ YAP';
        document.getElementById('toggleTxt').innerText = isReg ? 'Giriş Yap' : 'Kayıt Ol';
    };

    window.processAuth = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        try {
            if(isReg) {
                const user = await createUserWithEmailAndPassword(auth, email, pass);
                await set(ref(db, 'users/' + user.user.uid), {
                    username: document.getElementById('username').value || "Üye",
                    gender: document.getElementById('gender').value,
                    coins: 500, xp: 0, status: "idle", rank: "Çaylak Bronz"
                });
            } else {
                await signInWithEmailAndPassword(auth, email, pass);
            }
        } catch(e) { alert(e.message); }
    };

    onAuthStateChanged(auth, u => {
        if(u) {
            onValue(ref(db, 'users/' + u.uid), s => {
                userData = s.val();
                document.getElementById('uDisplay').innerText = userData.username;
                document.getElementById('uCoins').innerText = userData.coins;
                document.getElementById('uXP').innerText = userData.xp;
                openScreen('screenHome');
            });
            // Aktiflik XP'si
            setInterval(() => {
                if(userData) update(ref(db, 'users/' + u.uid), { xp: userData.xp + 1 });
            }, 1000);
            loadLeaderboard();
        } else { openScreen('screenAuth'); }
    });

    // --- GÖRÜNTÜLÜ MATCHING ---
    window.startMatching = async () => {
        openScreen('screenMatching');
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVideo').srcObject = localStream;
        
        peer = new Peer(auth.currentUser.uid);
        peer.on('open', (id) => {
            update(ref(db, 'users/' + auth.currentUser.uid), { status: "searching", peerId: id });
            searchPartner();
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', rs => {
                document.getElementById('remoteVideo').srcObject = rs;
                startTimer();
                document.getElementById('statusTxt').innerText = "Bağlandı!";
            });
        });
    };

    async function searchPartner() {
        const snap = await get(ref(db, 'users'));
        snap.forEach(child => {
            const u = child.val();
            if(child.key !== auth.currentUser.uid && u.status === "searching") {
                const call = peer.call(u.peerId, localStream);
                call.on('stream', rs => {
                    document.getElementById('remoteVideo').srcObject = rs;
                    update(ref(db, 'users/' + auth.currentUser.uid), { status: "busy" });
                    update(ref(db, 'users/' + child.key), { status: "busy" });
                    startTimer();
                });
            }
        });
    }

    function startTimer() {
        let t = 60;
        countdown = setInterval(() => {
            t--;
            document.getElementById('matchTime').innerText = t;
            if(t <= 0) closeMatch();
        }, 1000);
    }

    window.addTime = () => {
        if(userData.coins >= 30) {
            update(ref(db, 'users/' + auth.currentUser.uid), { coins: userData.coins - 30 });
            let current = parseInt(document.getElementById('matchTime').innerText);
            document.getElementById('matchTime').innerText = current + 30;
        }
    };

    window.closeMatch = () => {
        clearInterval(countdown);
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        if(peer) peer.destroy();
        update(ref(db, 'users/' + auth.currentUser.uid), { status: "idle", coins: userData.coins + 5 });
        
        const voice = new SpeechSynthesisUtterance("Görüşme bitti. +5 Coin kazandın. Aksanın üzerinde çalışmalısın.");
        window.speechSynthesis.speak(voice);
        openScreen('screenHome');
    };

    function loadLeaderboard() {
        const q = query(ref(db, 'users'), orderByChild('xp'), limitToLast(10));
        onValue(q, s => {
            const cont = document.getElementById('rankContainer');
            cont.innerHTML = "";
            let arr = [];
            s.forEach(c => arr.push(c.val()));
            arr.reverse().forEach((u, i) => {
                cont.innerHTML += `<div class="rank-item"><span>#${i+1} ${u.username}</span><b>${u.xp} XP</b></div>`;
            });
        });
    }

    window.openScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };
</script>
</body>
</html>
