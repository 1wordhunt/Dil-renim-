<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch | Pro Edition</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bs-blue: #0084ff; --bs-yellow: #ffcc00; --bs-green: #4cd137;
            --bg: #f5f6fa; --sidebar-w: 70px;
        }
        body { font-family: 'Arial Black', sans-serif; margin: 0; background: var(--bg); overflow: hidden; }
        
        /* EKRAN YÖNETİMİ */
        .screen { display: none; height: 100vh; width: 100vw; position: relative; }
        .active { display: flex; flex-direction: column; }

        /* KAYIT EKRANI */
        .auth-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 80%; max-width: 350px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 3px solid #eee; border-radius: 10px; font-weight: bold; box-sizing: border-box; }

        /* ANA DASHBOARD */
        #screenDashboard { flex-direction: row; }
        .sidebar { width: var(--sidebar-w); background: #2f3640; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 25px; }
        .side-btn { font-size: 28px; cursor: pointer; transition: 0.2s; }
        .side-btn:hover { transform: scale(1.2); }

        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .start-btn { 
            background: var(--bs-yellow); border: 5px solid #000; padding: 20px 50px; 
            border-radius: 15px; font-size: 24px; color: #000; cursor: pointer; box-shadow: 0 8px 0 #c7a000;
        }
        .start-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #c7a000; }

        /* BRAWL STARS STİLİ DÜKKAN */
        .shop-container { 
            flex: 1; padding: 20px; display: flex; gap: 20px; overflow-x: auto; 
            background: linear-gradient(to bottom, #1e90ff, #0055ff); align-items: center;
        }
        .shop-item { 
            min-width: 150px; height: 200px; background: white; border-radius: 15px; 
            border: 4px solid #000; position: relative; text-align: center; flex-shrink: 0;
        }
        .shop-item-header { background: #ff4757; color: white; padding: 5px; font-size: 12px; border-bottom: 3px solid #000; }
        .price-tag { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: var(--bs-yellow); padding: 5px 15px; border-radius: 20px; border: 2px solid #000; font-size: 12px; }

        /* PROFİL EKRANI */
        .profile-card { background: white; width: 90%; max-width: 400px; margin: auto; border-radius: 25px; padding: 30px; border: 5px solid #2f3640; text-align: center; }
        .p-img-wrap { width: 120px; height: 120px; border-radius: 50%; border: 6px solid var(--bs-blue); margin: 0 auto 20px; overflow: hidden; background: #eee; cursor: pointer; }
        #p-img-preview { width: 100%; height: 100%; object-fit: cover; }

        /* VİDEO CHAT (EKRANA SIĞDIRILMIŞ) */
        .video-wrapper { flex: 1; display: flex; flex-direction: column; background: #000; }
        .vid-box { height: 50%; width: 100%; object-fit: cover; border: 2px solid #333; }
        .vid-controls { position: absolute; bottom: 20px; display: flex; gap: 15px; width: 100%; justify-content: center; }
    </style>
</head>
<body>

<div id="screenRegister" class="screen active">
    <div class="auth-card">
        <h2 style="color: var(--bs-blue)">LANGMATCH</h2>
        <input type="text" id="regName" placeholder="Kullanıcı Adı">
        <input type="password" id="regPass" placeholder="Şifre">
        <input type="email" id="regEmail" placeholder="E-posta">
        <button class="start-btn" style="font-size: 16px; padding: 15px;" onclick="doRegister()">KAYDOL</button>
    </div>
</div>

<div id="screenDashboard" class="screen">
    <div class="sidebar">
        <div class="side-btn" onclick="showScreen('screenShop')">🛒</div>
        <div class="side-btn" onclick="showScreen('screenProfile')">👤</div>
        <div style="color: gold; font-size: 12px;">💰 <span id="uCoins">500</span></div>
    </div>
    <div class="main-content">
        <div id="displayBadge" style="background: #eee; padding: 10px 20px; border-radius: 20px; margin-bottom: 20px;">Developer</div>
        <button class="start-btn" onclick="showScreen('screenGender')">SAVAŞA BAŞLA!</button>
    </div>
</div>

<div id="screenShop" class="screen">
    <div style="padding: 20px; color: white; background: #0055ff; display: flex; justify-content: space-between;">
        <span>MAĞAZA</span>
        <span onclick="showScreen('screenDashboard')" style="cursor:pointer">❌</span>
    </div>
    <div class="shop-container">
        <div class="shop-item">
            <div class="shop-item-header">GÜNLÜK FIRSAT</div>
            <div style="font-size: 50px; margin-top: 20px;">🖼️</div>
            <p>Mavi Çerçeve</p>
            <div class="price-tag">200 💰</div>
        </div>
        <div class="shop-item">
            <div class="shop-item-header">ÖZEL TEKLİF</div>
            <div style="font-size: 50px; margin-top: 20px;">⚡</div>
            <p>XP Takviyesi</p>
            <div class="price-tag">100 💰</div>
        </div>
        <div class="shop-item" style="background: #dfe6e9;">
            <div class="shop-item-header">YAKINDA</div>
            <div style="font-size: 50px; margin-top: 20px; opacity: 0.3;">🔒</div>
        </div>
    </div>
</div>

<div id="screenProfile" class="screen">
    <div class="profile-card">
        <span onclick="showScreen('screenDashboard')" style="float: right; cursor:pointer">❌</span>
        <div class="p-img-wrap" onclick="document.getElementById('imgInput').click()">
            <img id="p-img-preview" src="" alt="Resim Seç">
        </div>
        <input type="file" id="imgInput" style="display:none" onchange="previewImage(this)">
        <h2 id="p-name-display">Kullanıcı Adı</h2>
        <p id="p-email-display" style="color: #636e72;"></p>
        <div style="background: #f1f2f6; padding: 15px; border-radius: 15px; text-align: left;">
            <b>Rütbe:</b> Rookie (0-200) <br>
            <b>Dil:</b> English (Learning)
        </div>
    </div>
</div>

<div id="screenGender" class="screen" style="justify-content: center; align-items: center; background: rgba(0,0,0,0.8);">
    <div class="auth-card">
        <h3>Eşleşme Tercihi</h3>
        <button class="start-btn" style="background: #ff4757; width: 100%; margin-bottom: 10px;" onclick="startCall()">KADIN</button>
        <button class="start-btn" style="background: #1e90ff; width: 100%;" onclick="startCall()">ERKEK</button>
        <p onclick="showScreen('screenDashboard')" style="color: blue; cursor:pointer; margin-top: 15px;">Vazgeç</p>
    </div>
</div>

<div id="screenVideo" class="screen">
    <div class="video-wrapper">
        <video id="remoteVideo" class="vid-box" autoplay playsinline></video>
        <video id="localVideo" class="vid-box" autoplay muted playsinline></video>
    </div>
    <div class="vid-controls">
        <button class="start-btn" style="background:red; padding: 10px 20px;" onclick="location.reload()">KAPAT</button>
    </div>
</div>

<script>
    let userData = { name: "", email: "", coins: 500 };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function doRegister() {
        userData.name = document.getElementById('regName').value;
        userData.email = document.getElementById('regEmail').value;
        if(!userData.name || !userData.email) return alert("Bilgileri doldur!");
        
        document.getElementById('p-name-display').innerText = userData.name;
        document.getElementById('p-email-display').innerText = userData.email;
        showScreen('screenDashboard');
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('p-img-preview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function startCall() {
        showScreen('screenVideo');
        const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVideo').srcObject = stream;
        
        const peer = new Peer();
        peer.on('open', (id) => {
            let target = prompt("Eşleşmek için karşı tarafın ID'sini gir (Test için):");
            if(target) {
                const call = peer.call(target, stream);
                call.on('stream', rs => document.getElementById('remoteVideo').srcObject = rs);
            }
        });
        peer.on('call', call => {
            call.answer(stream);
            call.on('stream', rs => document.getElementById('remoteVideo').srcObject = rs);
        });
    }
</script>

</body>
</html>
