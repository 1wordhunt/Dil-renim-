<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Connect | God Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --discord: #5865F2; --neon: #00f3ff; --gold: #f5af19; --bg: #0b0e11; --panel: #1e1f22; --red: #ff4757; }
        body { font-family: 'Rajdhani', sans-serif; margin: 0; background: var(--bg); color: #dbdee1; height: 100vh; overflow: hidden; }
        
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; position: absolute; overflow-y: auto; padding-bottom: 30px; }
        .active-screen { display: flex !important; }

        /* GRID MENU */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 92%; margin-top: 70px; }
        .category-card { 
            position: relative; height: 115px; border-radius: 15px; overflow: hidden; 
            border: 2px solid #333; cursor: pointer; display: flex; align-items: flex-end; padding: 12px;
        }
        .category-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.4); }
        .category-card span { position: relative; z-index: 2; font-weight: bold; font-family: 'Orbitron'; font-size: 14px; text-shadow: 0 0 5px #000; }

        /* AVATAR & FRAME (1000008715.png) */
        .avatar-wrap { position: relative; width: 85px; height: 85px; margin-left: 20px; margin-top: -40px; z-index: 2; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--panel); background: #000; object-fit: cover; }
        .avatar-frame { position: absolute; top: -18px; left: -18px; width: 120px; height: 120px; pointer-events: none; z-index: 3; }

        /* MATCHING UI */
        .match-grid { display: grid; grid-template-rows: 1fr 1fr; height: 100vh; width: 100vw; background: #000; }
        .video-box { position: relative; width: 100%; height: 100%; border-bottom: 2px solid var(--neon); background: #111; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .timer-ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 20px; border: 1px solid var(--neon); font-family: 'Orbitron'; z-index: 10; }
        .extend-btn { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 10px 20px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; display: none; z-index: 11; }

        /* BP PROGRESS */
        .bp-progress { width: 100%; height: 12px; background: #222; border-radius: 6px; margin: 10px 0; overflow: hidden; }
        .bp-bar { height: 100%; background: var(--gold); transition: 0.3s; }

        /* MODALS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--panel); width: 85%; max-width: 380px; border-radius: 20px; padding: 25px; border: 1px solid var(--neon); text-align: center; }
        
        .btn-action { background: var(--discord); border: none; padding: 12px; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .auth-input { width: 100%; padding: 12px; margin: 6px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .chat-box { height: 120px; background: #0b0e11; border-radius: 8px; overflow-y: auto; padding: 10px; margin: 10px 0; border: 1px solid #333; text-align: left; }
    </style>
</head>
<body>

    <div id="scrAuth" class="screen active-screen">
        <div style="margin-top:60px; width:85%; text-align: center;">
            <h1 style="color:var(--neon); font-family:'Orbitron';">NEXUS OMEGA</h1>
            <input type="text" id="uName" class="auth-input" placeholder="Kullanıcı Adı">
            <input type="email" id="uEmail" class="auth-input" placeholder="E-posta">
            <input type="password" id="uPass" class="auth-input" placeholder="Şifre">
            <div style="display:flex; gap:6px;">
                <input type="number" id="uAge" class="auth-input" style="width:33%;" placeholder="Yaş">
                <select id="uGender" class="auth-input" style="width:33%;"><option value="Erkek">Erkek</option><option value="Kız">Kız</option></select>
                <select id="uCountry" class="auth-input" style="width:34%;"><option value="Türkiye">TR 🇹🇷</option><option value="ABD">US 🇺🇸</option></select>
            </div>
            <button class="btn-action" onclick="handleAuth()">SİSTEMİ BAŞLAT</button>
        </div>
    </div>

    <div id="scrLobby" class="screen">
        <div style="position:fixed; top:0; width:100%; padding:15px; display:flex; justify-content:space-between; background:var(--panel); z-index:100; border-bottom: 1px solid #333;">
            <b style="color:var(--neon); font-family:'Orbitron';">NEXUS</b>
            <div>💰 <span id="dispCoins">0</span> | XP: <span id="dispXp">0</span></div>
        </div>
        <div class="grid-menu">
            <div class="category-card" style="grid-column:span 2; border-color:var(--neon);" onclick="openModal('modalMatchPref')">
                <img src="https://i.ibb.co/zHQQpn06/match.jpg"><span>EŞLEŞME (YENİ)</span>
            </div>
            <div class="category-card" onclick="openModal('modalWords')">
                <img src="https://i.ibb.co/zHQQpn06/telaffuz.jpg"><span>TELAFFUZ AI</span>
            </div>
            <div class="category-card" onclick="openModal('modalClans')">
                <img src="https://i.ibb.co/zHQQpn06/klan.jpg"><span>KLAN CHAT</span>
            </div>
            <div class="category-card" onclick="openModal('modalBP')">
                <img src="https://i.ibb.co/zHQQpn06/1777825427839-2.jpg"><span>BATTLE PASS</span>
            </div>
            <div class="category-card" onclick="openModal('modalDaily')">
                <img src="https://i.ibb.co/zHQQpn06/soru.jpg"><span>GÜNLÜK SORU</span>
            </div>
            <button class="btn-action" style="grid-column:span 2; background:#2b2d31;" onclick="switchTab('scrProfile')">PROFİL & ÜYE ARA</button>
        </div>
    </div>

    <div id="scrProfile" class="screen">
        <div class="profile-card" style="width:92%; background:var(--panel); border-radius:15px; overflow:hidden; margin-top:20px; border:1px solid #333;">
            <div id="pBanner" style="height:110px; background:linear-gradient(45deg, #bc13fe, #00f3ff); cursor:pointer;" onclick="document.getElementById('fBanner').click()"></div>
            <div class="avatar-wrap">
                <img src="1000008715.png" class="avatar-frame">
                <img id="pImg" src="https://via.placeholder.com/150" class="avatar-img" onclick="document.getElementById('fAvatar').click()">
            </div>
            <div style="padding:50px 20px 20px;">
                <h2 style="margin:0;"><span id="profName">...</span> <span id="devBadge" style="font-size:12px; color:var(--gold); display:none;">[developer]</span></h2>
                <div style="background:#111; padding:10px; border-radius:8px; margin-top:10px; font-size:14px;" id="profBio">Henüz bir bio eklenmemiş.</div>
                <button class="btn-action" style="margin-top:15px;" onclick="openModal('modalSearch')">🔎 ÜYE ARA</button>
                <button class="btn-action" style="background:#444;" onclick="switchTab('scrLobby')">GERİ</button>
            </div>
        </div>
    </div>

    <div id="scrMatch" class="screen">
        <div class="timer-ui" id="matchTimer">00:30</div>
        <button id="extendBtn" class="extend-btn" onclick="extendTime()">⏱ +30 SN UZAT (100 💰)</button>
        <div class="match-grid">
            <div class="video-box"><video id="remoteVid" autoplay playsinline></video></div>
            <div class="video-box"><video id="localVid" autoplay muted playsinline></video></div>
        </div>
        <button class="btn-action" style="position:fixed; bottom:20px; width:80%; background:var(--red);" onclick="stopMatching()">SOHBETİ BİTİR</button>
    </div>

    <div id="modalBP" class="modal"><div class="modal-content">
        <h2 style="color:var(--gold);">NEXUS PASS</h2>
        <div style="text-align:left; font-size:14px;">
            Sıradaki Ödül: <span id="bpNextText">200 XP</span>
            <div class="bp-progress"><div class="bp-bar" id="bpBar"></div></div>
        </div>
        <div style="display:flex; gap:10px; overflow-x:auto; padding:10px 0;" id="bpTrack"></div>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">KAPAT</button>
    </div></div>

    <div id="modalClans" class="modal"><div class="modal-content">
        <h3 id="cTitle">KLAN SOHBETİ</h3>
        <div id="chatBox" class="chat-box"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="cMsg" class="auth-input" placeholder="Mesaj...">
            <button class="btn-action" style="width:70px;" onclick="sendChat()">YAZ</button>
        </div>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">KAPAT</button>
    </div></div>

    <div id="modalMatchPref" class="modal"><div class="modal-content">
        <h3>EŞLEŞME AYARI</h3>
        <button class="btn-action" style="background:var(--red);" onclick="startMatch('Kız')">KIZLARLA EŞLEŞ</button>
        <button class="btn-action" onclick="startMatch('Erkek')">ERKEKLERLE EŞLEŞ</button>
        <label style="display:flex; align-items:center; gap:10px; margin-top:15px; cursor:pointer;">
            <input type="checkbox" id="camCheck" checked> <b>Kameram Açık Olsun</b>
        </label>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">İPTAL</button>
    </div></div>

    <input type="file" id="fAvatar" style="display:none;" accept="image/*" onchange="upImg('pImg')">
    <input type="file" id="fBanner" style="display:none;" accept="image/*" onchange="upImg('pBanner')">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, update, set, increment, push, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        databaseURL: "https://nexus-b73be-default-rtdb.firebaseio.com",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = () => document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    window.switchTab = (id) => { closeModal(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); };

    onAuthStateChanged(auth, user => {
        if(user) {
            switchTab('scrLobby');
            onValue(ref(db, 'users/' + user.uid), s => {
                const d = s.val(); window.uData = d;
                document.getElementById('dispCoins').innerText = d.coins;
                document.getElementById('dispXp').innerText = d.xp;
                document.getElementById('profName').innerText = d.username;
                if(d.pImg) document.getElementById('pImg').src = d.pImg;
                if(d.pBanner) document.getElementById('pBanner').style.backgroundImage = `url(${d.pBanner})`;
                
                // Dev badge kontrolü (Senin adını buraya yaz kanka)
                document.getElementById('devBadge').style.display = (d.username === "Deniz" || d.username === "admin") ? "inline" : "none";
                
                renderBP(d.xp);
                if(d.clanId) listenChat(d.clanId);
            });
        } else { switchTab('scrAuth'); }
    });

    // --- SÜRE UZATMALI EŞLEŞME SİSTEMİ ---
    let matchTime = 30;
    let timerInt;
    window.startMatch = async (pref) => {
        const cam = document.getElementById('camCheck').checked;
        closeModal(); switchTab('scrMatch');
        matchTime = 30;
        document.getElementById('extendBtn').style.display = 'none';

        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: cam, audio: true});
            document.getElementById('localVid').srcObject = stream;
            window.myStream = stream;
            
            timerInt = setInterval(() => {
                matchTime--;
                document.getElementById('matchTimer').innerText = `00:${matchTime < 10 ? '0'+matchTime : matchTime}`;
                
                if(matchTime <= 10) document.getElementById('extendBtn').style.display = 'block';
                
                if(matchTime <= 0) {
                    clearInterval(timerInt);
                    stopMatching();
                    alert("Süre bitti!");
                }
            }, 1000);
        } catch { alert("İzin gerekli!"); switchTab('scrLobby'); }
    };

    window.extendTime = () => {
        if(uData.coins < 100) return alert("Yetersiz Coin!");
        update(ref(db, 'users/'+auth.currentUser.uid), { coins: increment(-100) });
        matchTime += 30;
        document.getElementById('extendBtn').style.display = 'none';
        alert("+30 Saniye Eklendi!");
    };

    window.stopMatching = () => {
        clearInterval(timerInt);
        if(window.myStream) window.myStream.getTracks().forEach(t => t.stop());
        switchTab('scrLobby');
    };

    // --- KAYIT SİSTEMİ (BOZULMAYAN) ---
    window.handleAuth = async () => {
        const e = document.getElementById('uEmail').value, p = document.getElementById('uPass').value, n = document.getElementById('uName').value;
        const a = document.getElementById('uAge').value, g = document.getElementById('uGender').value, c = document.getElementById('uCountry').value;
        
        if(!e || !p || !n || !a) return alert("Tüm alanları doldur kanka!");

        try {
            const res = await createUserWithEmailAndPassword(auth, e, p);
            await set(ref(db, 'users/' + res.user.uid), { 
                username: n, email: e, age: a, gender: g, country: c, 
                coins: 500, xp: 0, bio: "Nexus kullanıcısı", clanId: null 
            });
        } catch (err) {
            try { await signInWithEmailAndPassword(auth, e, p); } catch { alert("Hata: " + err.message); }
        }
    };

    // --- BATTLE PASS SİSTEMİ ---
    function renderBP(xp) {
        const nextXp = 200 - (xp % 200);
        const progress = ((xp % 200) / 200) * 100;
        document.getElementById('bpBar').style.width = progress + "%";
        document.getElementById('bpNextText').innerText = nextXp + " XP";

        const track = document.getElementById('bpTrack'); track.innerHTML = "";
        for(let i=1; i<=10; i++){
            const isOk = xp >= (i*200);
            track.innerHTML += `<div style="min-width:60px; height:80px; background:${isOk?'#1a3333':'#222'}; border:2px solid ${isOk?var(--neon):'#444'}; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <small>LVL ${i}</small><b>${i%2==0?'💰':'💎'}</b>
            </div>`;
        }
    }

    // --- KLAN CHAT SİSTEMİ ---
    function listenChat(cid) {
        onValue(ref(db, `clans/${cid}/msgs`), s => {
            const box = document.getElementById('chatBox'); box.innerHTML = "";
            s.forEach(m => {
                box.innerHTML += `<div style="margin-bottom:5px;"><b>${m.val().u}:</b> ${m.val().t}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    window.sendChat = () => {
        const t = document.getElementById('cMsg').value;
        if(t && uData.clanId) {
            push(ref(db, `clans/${uData.clanId}/msgs`), { u: uData.username, t: t });
            document.getElementById('cMsg').value = "";
        }
    };

    window.upImg = (type) => {
        const file = document.getElementById(type === 'pImg' ? 'fAvatar' : 'fBanner').files[0];
        const reader = new FileReader();
        reader.onload = (e) => update(ref(db, 'users/'+auth.currentUser.uid), { [type]: e.target.result });
        reader.readAsDataURL(file);
    };

</script>
</body>
</html>
