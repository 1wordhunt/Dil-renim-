<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Final Strike</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --discord: #5865F2; --neon: #00f3ff; --gold: #f5af19; --bg: #0b0e11; --panel: #1e1f22; --red: #ff4757; }
        body { font-family: 'Rajdhani', sans-serif; margin: 0; background: var(--bg); color: #dbdee1; height: 100vh; overflow: hidden; }
        
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; position: absolute; }
        .active-screen { display: flex !important; }

        /* GRID MENU */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 92%; margin-top: 70px; }
        .category-card { 
            position: relative; height: 110px; border-radius: 15px; overflow: hidden; 
            border: 2px solid #333; cursor: pointer; display: flex; align-items: flex-end; padding: 10px;
        }
        .category-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.5); }
        .category-card span { position: relative; z-index: 2; font-weight: bold; font-family: 'Orbitron'; font-size: 13px; }

        /* MATCHING AREA (SPLIT SCREEN) */
        .match-grid { display: grid; grid-template-rows: 1fr 1fr; height: 100vh; width: 100vw; background: #000; }
        .video-wrapper { position: relative; width: 100%; height: 100%; border-bottom: 2px solid #222; }
        video { width: 100%; height: 100%; object-fit: cover; background: #111; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 5px; font-size: 12px; }

        /* MODALS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
        .modal-content { background: var(--panel); width: 85%; max-width: 350px; border-radius: 20px; padding: 20px; border: 1px solid var(--neon); text-align: center; }
        
        .btn-action { background: var(--discord); border: none; padding: 12px; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .auth-input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="scrAuth" class="screen active-screen">
        <div style="margin-top:80px; width:80%;">
            <h1 style="color:var(--neon); font-family:'Orbitron'; text-align:center;">NEXUS</h1>
            <input type="text" id="uName" class="auth-input" placeholder="Kullanıcı Adı">
            <input type="email" id="uEmail" class="auth-input" placeholder="E-posta">
            <input type="password" id="uPass" class="auth-input" placeholder="Şifre">
            <button class="btn-action" onclick="handleAuth()">GİRİŞ YAP</button>
        </div>
    </div>

    <div id="scrLobby" class="screen">
        <div style="position:fixed; top:0; width:100%; padding:15px; display:flex; justify-content:space-between; background:var(--panel); z-index:100;">
            <b style="color:var(--neon)">NEXUS</b>
            <div>💰 <span id="dispCoins">0</span> | XP: <span id="dispXp">0</span></div>
        </div>
        <div class="grid-menu">
            <div class="category-card" style="grid-column:span 2;" onclick="startMatching()">
                <img src="https://i.ibb.co/zHQQpn06/match.jpg"><span>GÖRÜNTÜLÜ EŞLEŞME</span>
            </div>
            <div class="category-card" onclick="openModal('modalWords')">
                <img src="https://i.ibb.co/zHQQpn06/telaffuz.jpg"><span>TELAFFUZ AI</span>
            </div>
            <div class="category-card" onclick="openModal('modalClans')">
                <img src="https://i.ibb.co/zHQQpn06/klan.jpg"><span>KLANLAR</span>
            </div>
            <div class="category-card" onclick="openModal('modalBP')">
                <img src="https://i.ibb.co/zHQQpn06/1777825427839-2.jpg"><span>PASS</span>
            </div>
            <div class="category-card" onclick="openModal('modalDaily')">
                <img src="https://i.ibb.co/zHQQpn06/soru.jpg"><span>GÜNLÜK SORU</span>
            </div>
            <button class="btn-action" style="grid-column:span 2;" onclick="switchTab('scrProfile')">PROFİL</button>
        </div>
    </div>

    <div id="scrMatch" class="screen">
        <div class="match-grid">
            <div class="video-wrapper">
                <video id="remoteVid" autoplay playsinline></video>
                <div class="video-label" id="remoteLabel">Rakip Aranıyor...</div>
            </div>
            <div class="video-wrapper">
                <video id="localVid" autoplay muted playsinline></video>
                <div class="video-label">Sen (Kameran)</div>
                <div style="position:absolute; top:10px; right:10px; display:flex; gap:10px;">
                    <button onclick="toggleCam()" style="border-radius:50%; width:35px; height:35px;">📷</button>
                    <button onclick="stopMatch()" style="background:var(--red); border-radius:5px; padding:5px 10px;">KAPAT</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modalClans" class="modal"><div class="modal-content">
        <h3>KLAN SİSTEMİ</h3>
        <input type="text" id="clanName" class="auth-input" placeholder="Klan Adı">
        <button class="btn-action" onclick="createClan()">KLAN KUR (590 💰)</button>
        <div id="clanList" style="margin-top:10px; max-height:150px; overflow-y:auto;"></div>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">KAPAT</button>
    </div></div>

    <div id="modalWords" class="modal"><div class="modal-content">
        <h3>TELAFFUZ AI</h3>
        <h1 id="targetWord" style="color:var(--neon);">HELLO</h1>
        <button class="btn-action" id="micBtn" onclick="startSpeech()">🎤 DİNLE VE ANALİZ ET</button>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">KAPAT</button>
    </div></div>

    <div id="scrProfile" class="screen">
        <div style="background:var(--panel); width:90%; border-radius:15px; padding:20px; margin-top:50px;">
            <h2 id="profName">...</h2>
            <p id="profBio">...</p>
            <button class="btn-action" onclick="openModal('modalSearch')">ÜYE ARA & ARKADAŞ EKLE</button>
            <button class="btn-action" style="background:var(--red); margin-top:20px;" onclick="logout()">ÇIKIŞ YAP</button>
            <button class="btn-action" style="background:#444;" onclick="switchTab('scrLobby')">GERİ</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, update, set, increment, push, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        databaseURL: "https://nexus-b73be-default-rtdb.firebaseio.com",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = () => document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    window.switchTab = (id) => { closeModal(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); };

    onAuthStateChanged(auth, user => {
        if(user) {
            switchTab('scrLobby');
            onValue(ref(db, 'users/' + user.uid), s => {
                const d = s.val(); window.uData = d;
                document.getElementById('dispCoins').innerText = d.coins;
                document.getElementById('dispXp').innerText = d.xp;
                document.getElementById('profName').innerText = d.username;
                document.getElementById('profBio').innerText = d.bio;
            });
            loadClans();
        } else { switchTab('scrAuth'); }
    });

    // --- MATCHING (50/50 EKRAN) ---
    let myStream;
    window.startMatching = async () => {
        switchTab('scrMatch');
        myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('localVid').srcObject = myStream;
        
        // Basit kuyruk mantığı (Okul testi için)
        const qRef = ref(db, 'matchQueue/' + auth.currentUser.uid);
        set(qRef, { name: uData.username, active: true });
        
        setTimeout(() => {
            document.getElementById('remoteLabel').innerText = "Bağlanıldı: TestUser";
            // Normalde burada WebRTC sinyali olur, okulda test için görüntüyü simüle edebilirsin.
        }, 3000);
    };

    window.stopMatch = () => {
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        set(ref(db, 'matchQueue/' + auth.currentUser.uid), null);
        switchTab('scrLobby');
    };

    // --- KLANLAR ---
    window.createClan = () => {
        const name = document.getElementById('clanName').value;
        if(uData.coins < 590) return alert("Coin yetersiz! (Gereken: 590)");
        const newClan = push(ref(db, 'clans'));
        set(newClan, { name, xp: 0, leader: uData.username });
        update(ref(db, 'users/' + auth.currentUser.uid), { coins: increment(-590) });
        alert("Klan kuruldu!");
    };

    function loadClans() {
        onValue(ref(db, 'clans'), s => {
            const list = document.getElementById('clanList'); list.innerHTML = "";
            s.forEach(c => {
                list.innerHTML += `<div style="background:#000; padding:10px; margin:5px; border-radius:5px; display:flex; justify-content:space-between;">
                    <span>${c.val().name}</span><b>${c.val().xp} XP</b>
                </div>`;
            });
        });
    }

    // --- TELAFFUZ AI ---
    window.startSpeech = () => {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'en-US';
        document.getElementById('micBtn').innerText = "Dinleniyor...";
        rec.onresult = (e) => {
            const result = e.results[0][0].transcript.toLowerCase();
            if(result === "hello") {
                update(ref(db, 'users/' + auth.currentUser.uid), { xp: increment(50) });
                alert("Harika! +50 XP");
            } else alert("Dediğin: " + result);
            document.getElementById('micBtn').innerText = "🎤 DİNLE VE ANALİZ ET";
        };
        rec.start();
    };

    window.logout = () => signOut(auth);
    window.handleAuth = async () => {
        const e = document.getElementById('uEmail').value, p = document.getElementById('uPass').value, n = document.getElementById('uName').value;
        try {
            const res = await createUserWithEmailAndPassword(auth, e, p);
            await set(ref(db, 'users/' + res.user.uid), { username: n, coins: 1000, xp: 0, bio: "Nexus Connect Üyesi" });
        } catch { await signInWithEmailAndPassword(auth, e, p); }
    };
</script>
</body>
</html>
