<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v19 | Dragon Fixed</title>
    <style>
        :root { --bg: #000; --accent: #66fcf1; --gold: #f5af19; --red: #ff3b5c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; }
        .active { display: flex !important; }

        /* --- KAYIT EKRANI --- */
        #screenAuth { justify-content: center; align-items: center; background: radial-gradient(circle, #1f2833 0%, #000 100%); }
        .auth-card { width: 80%; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 25px; border: 1px solid var(--accent); backdrop-filter: blur(10px); text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }

        /* --- TOP BAR --- */
        .top-bar { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        
        /* --- DÜKKAN --- */
        .shop-container { padding: 15px; overflow-y: auto; flex: 1; }
        .product-card { background: #1a1a1d; border-radius: 20px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; display: flex; align-items: center; gap: 15px; }
        .p-img { width: 70px; height: 70px; border-radius: 12px; object-fit: contain; background: #000; border: 1px solid #444; }
        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* --- PROFİL --- */
        .avatar-wrap { position: relative; width: 150px; height: 150px; margin: 30px auto; display: flex; align-items: center; justify-content: center; }
        .u-pic { width: 95px; height: 95px; border-radius: 50%; z-index: 1; border: 2px solid #222; }
        .u-frame { position: absolute; width: 155px; height: 155px; z-index: 2; pointer-events: none; }

        .btn-main { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .block { border-radius: 22px; height: 130px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div class="auth-card">
        <h2 style="color:var(--accent)">THE CORE: NEXUS</h2>
        <input type="text" id="regName" placeholder="Adını Yaz">
        <button class="btn-main" onclick="initApp()">GİRİŞ YAP</button>
    </div>
</div>

<div id="screenHome" class="screen">
    <div class="top-bar">
        <div onclick="openScreen('screenProfile')" style="cursor:pointer">👤 <b id="nDisplay">Dev</b></div>
        <div style="color:var(--gold)">💰 <span id="myCoins">1500</span></div>
    </div>
    <div class="grid">
        <div class="block" style="grid-column: span 2; background: var(--red);">GLOBAL CHAT</div>
        <div class="block" style="background: #2ecc71;">MATCHING</div>
        <div class="block" style="background: #f1c40f;" onclick="openScreen('screenShop')">SHOP</div>
        <div class="block" style="background: #3498db;">TELAFFUZ</div>
        <div class="block" style="background: #9b59b6;">ÜYE ARA</div>
    </div>
</div>

<div id="screenShop" class="screen">
    <div class="top-bar"><span onclick="openScreen('screenHome')" style="cursor:pointer">⬅️ GERİ</span> <b>MARKET</b></div>
    <div class="shop-container">
        <div class="product-card">
            <img src="https://i.ibb.co/FqmZGsjZ/b854bda4d42c0228b4af81984c8bdd78.jpg" class="p-img">
            <div style="flex:1"><b>Altın Ejderha</b><br><small style="color:var(--gold)">0 Coin</small></div>
            <button class="buy-btn" onclick="processBuy('dragon', 0)">AL</button>
        </div>
    </div>
</div>

<div id="screenProfile" class="screen">
    <div class="top-bar"><span onclick="openScreen('screenHome')" style="cursor:pointer">⬅️ GERİ</span> <b>PROFİL</b></div>
    <div class="avatar-wrap">
        <img src="https://via.placeholder.com/100" class="u-pic">
        <img id="activeFrame" src="" class="u-frame" style="display:none;">
    </div>
    <div style="padding:20px; text-align:center;">
        <h2 id="pName">Developer</h2>
        <div id="inventory">
            <h4>ENVANTERİN</h4>
            <p id="emptyNote">Eşya yok.</p>
        </div>
    </div>
</div>

<script>
    let user = { name: '', coins: 1500, inventory: [] };
    let db = {
        dragon: { name: 'Altın Ejderha', img: 'https://i.ibb.co/FqmZGsjZ/b854bda4d42c0228b4af81984c8bdd78.jpg' }
    };

    function initApp() {
        const n = document.getElementById('regName').value;
        if(!n) return alert("İsim yaz!");
        user.name = n + " (Dev)";
        document.getElementById('nDisplay').innerText = user.name;
        document.getElementById('pName').innerText = user.name;
        openScreen('screenHome');
    }

    function processBuy(id, price) {
        if(user.inventory.includes(id)) return alert("Zaten aldın!");
        user.inventory.push(id);
        document.getElementById('emptyNote').style.display = 'none';
        updateInventory();
        alert("Aldın kanka!");
    }

    function updateInventory() {
        const inv = document.getElementById('inventory');
        inv.innerHTML = '<h4>ENVANTERİN</h4>';
        user.inventory.forEach(itemId => {
            inv.innerHTML += `<button class="btn-main" style="margin-bottom:10px;" onclick="useItem('${itemId}')">${db[itemId].name} TAK</button>`;
        });
    }

    function useItem(id) {
        const frame = document.getElementById('activeFrame');
        frame.src = db[id].img;
        frame.style.display = 'block';
    }

    function openScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
