<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch | MVP</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #5865f2; --bg: #ffffff; --border: #e3e5e8; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: #333; }
        .screen { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }
        
        /* Dashboard Layout */
        #screenDashboard { flex-direction: row; align-items: stretch; justify-content: flex-start; }
        .sidebar { width: 80px; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* Elements */
        input { width: 80%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .icon-btn { font-size: 24px; cursor: pointer; filter: grayscale(1); }
        .icon-btn:hover { filter: grayscale(0); }

        /* Video */
        #screenVideo { background: #000; }
        .video-box { width: 100%; height: 50%; object-fit: cover; }
    </style>
</head>
<body>

<div id="screenEmail" class="screen active">
    <h2>LangMatch Login</h2>
    <input type="email" id="emailInput" placeholder="E-posta adresinizi girin">
    <button class="btn" onclick="send2FA()">KOD GÖNDER</button>
</div>

<div id="screen2FA" class="screen">
    <h2>Verify Email</h2>
    <p>Kod e-postanıza gönderildi (Simülasyon: 123456)</p>
    <input type="text" id="codeInput" placeholder="6 Haneli Kod">
    <button class="btn" onclick="verify2FA()">DOĞRULA</button>
</div>

<div id="screenDashboard" class="screen">
    <div class="sidebar">
        <div class="icon-btn" onclick="showShop()" title="Dükkan">🛒</div>
        <div class="icon-btn" title="Profil">👤</div>
        <div style="margin-top: auto; padding-bottom: 20px;">💰 500</div>
    </div>
    <div class="main-content">
        <h1>Welcome, Developer</h1>
        <p>Ready to practice English?</p>
        <button class="btn" style="position: absolute; bottom: 50px;" onclick="showGenderSelect()">START MATCHING</button>
    </div>
</div>

<div id="screenGender" class="screen">
    <h3>Who do you want to talk to?</h3>
    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
        <button class="btn" style="background: #ff4d94;" onclick="startMatching('female')">FEMALE</button>
        <button class="btn" style="background: #4d94ff;" onclick="startMatching('male')">MALE</button>
    </div>
    <button onclick="backToDash()" style="border:none; background:none; cursor:pointer;">Back</button>
</div>

<div id="screenShop" class="screen">
    <h2>🛒 SHOP</h2>
    <p>New items coming soon!</p>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div style="border: 1px solid #ddd; padding: 20px; border-radius: 10px;">Avatar Frame <br> 200💰</div>
        <div style="border: 1px solid #ddd; padding: 20px; border-radius: 10px;">Gift Pack <br> 100💰</div>
    </div>
    <button class="btn" style="margin-top: 30px;" onclick="backToDash()">EXIT SHOP</button>
</div>

<div id="screenVideo" class="screen">
    <video id="remoteVideo" class="video-box" autoplay playsinline></video>
    <video id="localVideo" class="video-box" autoplay muted playsinline></video>
    <button class="btn" style="position: absolute; bottom: 20px; background: red;" onclick="location.reload()">HANG UP</button>
</div>

<script>
    let peer;
    let localStream;
    const testRoom = "langmatch-global-room-2026"; // Akşamki test için sabit oda

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // 1 & 2: Auth
    function send2FA() { 
        if(document.getElementById('emailInput').value) switchScreen('screen2FA'); 
    }
    function verify2FA() { switchScreen('screenDashboard'); }

    // 3 & 4: Dashboard & Shop
    function showShop() { switchScreen('screenShop'); }
    function backToDash() { switchScreen('screenDashboard'); }
    function showGenderSelect() { switchScreen('screenGender'); }

    // 5: Matching Logic (Akşamki otomatik eşleşme kalbi)
    async function startMatching(pref) {
        switchScreen('screenVideo');
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVideo').srcObject = localStream;

        // Rastgele bir ID oluştur veya havuzdaki birine bağlan
        peer = new Peer(); 

        peer.on('open', (id) => {
            console.log("My ID: " + id);
            // Akşam testi için: Prompt ile karşı cihazın ID'sini girerek direkt bağlanabilirsin.
            // Ama gerçek sistemde bu otomatik olacak.
            let target = prompt("Diğer cihazın ID'sini gir (Otomatik eşleşme simülasyonu):");
            if(target) {
                const call = peer.call(target, localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });
            }
        });

        peer.on('call', (call) => {
            call.answer(localStream);
            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });
        });
    }
</script>

</body>
</html>
