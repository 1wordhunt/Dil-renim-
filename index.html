<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro | Ultimate</title>
    <style>
        :root {
            --bg: #0f1015; --card: #1c1c1e; --text: #ffffff;
            --neon-red: linear-gradient(135deg, #ff416c, #ff4b2b);
            --neon-green: linear-gradient(135deg, #00b09b, #96c93d);
            --neon-blue: linear-gradient(135deg, #2193b0, #6dd5ed);
            --neon-yellow: linear-gradient(135deg, #f12711, #f5af19);
        }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; top: 0; left: 0; background: var(--bg); }
        .active { display: flex !important; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--card); border-bottom: 1px solid #333; }
        .p-circle { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #f5af19; object-fit: cover; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; flex: 1; overflow-y: auto; padding-bottom: 90px; }
        .menu-btn { border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; border: none; cursor: pointer; color: white; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(20,20,25,0.98); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; z-index: 1000; }
        .nav-btn { font-size: 10px; text-align: center; color: #888; cursor: pointer; }
        .nav-btn.active { color: #00d2ff; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; background: #25262e; border: 1px solid #444; color: white; box-sizing: border-box; }
        .user-card { background: var(--card); margin: 8px 15px; padding: 12px; border-radius: 18px; display: flex; align-items: center; gap: 12px; border: 1px solid #333; }
        .btn-main { background: var(--neon-blue); padding: 15px; border-radius: 12px; border: none; color: white; font-weight: bold; width: 100%; cursor: pointer; }
        .claim-btn { background: var(--neon-yellow); color: black; border: none; padding: 5px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div style="margin: auto; width: 85%; text-align: center;">
        <h2>LangMatch Pro</h2>
        <div onclick="document.getElementById('regFile').click()" style="cursor:pointer">
            <img id="regPreview" src="https://via.placeholder.com/100" style="width:100px; height:100px; border-radius:50%; border:3px solid #f5af19; object-fit:cover;">
        </div>
        <input type="file" id="regFile" style="display:none" onchange="previewFile(this)">
        <input type="text" id="regName" placeholder="Kullanıcı Adı">
        <select id="regGender"><option>Erkek</option><option>Kız</option></select>
        <button class="btn-main" onclick="handleRegister()">BAŞLAT</button>
    </div>
</div>

<div id="screenHome" class="screen">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="uAvatar" src="" class="p-circle">
            <div id="uName" style="font-weight:bold;">User</div>
        </div>
        <div style="color:#ffd60a; font-weight:bold;">💰 <span id="uCoins">0</span></div>
    </div>
    <div class="main-grid">
        <div class="menu-btn" style="grid-column:span 2; height:80px; background:var(--neon-red);" onclick="openScreen('screenGlobal')">GLOBAL CHAT</div>
        <div class="menu-btn" style="height:140px; background:var(--neon-green);" onclick="openScreen('screenMatch')">MATCHING</div>
        <div class="menu-btn" style="height:140px; background:var(--neon-yellow);" onclick="openScreen('screenRanking')">SIRALAMA</div>
        <div class="menu-btn" style="height:140px; background:var(--neon-blue);" onclick="openScreen('screenPronounce')">TELAFFUZ</div>
        <div class="menu-btn" style="height:140px; background:var(--card); border:1px solid #444;" onclick="openScreen('screenSearch')">ÜYE ARA</div>
    </div>
    <div class="nav-bar">
        <div class="nav-btn" onclick="openScreen('screenHome')">🏠<br>ANA</div>
        <div class="nav-btn" onclick="openScreen('screenTasks')">✅<br>GÖREVLER</div>
        <div class="nav-btn" onclick="openScreen('screenProfile')">👤<br>PROFİL</div>
    </div>
</div>

<div id="screenTasks" class="screen">
    <div class="header"><span onclick="openScreen('screenHome')">⬅️</span> <b>Görevler</b> <span></span></div>
    <div id="taskContainer" style="padding-top:10px;">
        <div class="user-card" id="task1">
            <span style="flex:1">Günlük Giriş Ödülü</span>
            <button class="claim-btn" onclick="claimCoin(50, 'task1')">AL (50 💰)</button>
        </div>
        <div class="user-card" id="task2">
            <span style="flex:1">Profilini Tamamla</span>
            <button class="claim-btn" onclick="claimCoin(100, 'task2')">AL (100 💰)</button>
        </div>
    </div>
</div>

<div id="screenSearch" class="screen">
    <div class="header"><span onclick="openScreen('screenHome')">⬅️</span> <b>Üye Ara</b> <span></span></div>
    <div style="padding:15px;"><input type="text" id="searchInput" placeholder="İsim yaz..." oninput="updateSearch()"></div>
    <div id="searchList"></div>
</div>

<div id="screenRanking" class="screen">
    <div class="header"><span onclick="openScreen('screenHome')">⬅️</span> <b>Sıralama</b> <span></span></div>
    <div id="rankList"></div>
</div>

<div id="screenMatch" class="screen">
    <div class="header"><span onclick="openScreen('screenHome')">⬅️</span> <b>Eşleşme</b> <span></span></div>
    <div id="matchStatus" style="text-align:center; margin-top:100px;">
        <p>Kimi Aramak İstersin?</p>
        <button class="btn-main" style="width:80%; margin-bottom:10px;" onclick="startMatching('Kız')">KIZLARLA EŞLEŞ</button>
        <button class="btn-main" style="width:80%; background:gray" onclick="startMatching('Erkek')">ERKEKLERLE EŞLEŞ</button>
    </div>
</div>

<script>
    let user = { name: '', avatar: '', coins: 0, gender: '' };
    let database = []; // Sadece gerçek kayıt olanlar

    function previewFile(input) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = e => {
                document.getElementById('regPreview').src = e.target.result;
                user.avatar = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function handleRegister() {
        user.name = document.getElementById('regName').value;
        user.gender = document.getElementById('regGender').value;
        if(!user.name) return alert("İsim gir!");
        
        database.push({name: user.name, avatar: user.avatar, coins: user.coins});
        
        document.getElementById('uName').innerText = user.name;
        document.getElementById('uAvatar').src = user.avatar || 'https://via.placeholder.com/100';
        openScreen('screenHome');
    }

    function openScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screenRanking') updateRanking();
    }

    function claimCoin(amount, taskId) {
        user.coins += amount;
        document.getElementById('uCoins').innerText = user.coins;
        document.getElementById(taskId).style.opacity = "0.5";
        document.getElementById(taskId).querySelector('button').innerText = "ALINDI";
        document.getElementById(taskId).querySelector('button').disabled = true;
        alert(amount + " Coin eklendi!");
    }

    function updateSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const list = document.getElementById('searchList');
        list.innerHTML = '';
        database.filter(u => u.name.toLowerCase().includes(q)).forEach(u => {
            list.innerHTML += `<div class="user-card"><img src="${u.avatar}" style="width:40px;height:40px;border-radius:50%"><b>${u.name}</b></div>`;
        });
    }

    function updateRanking() {
        const list = document.getElementById('rankList');
        list.innerHTML = '';
        database.sort((a,b) => b.coins - a.coins).forEach((u, i) => {
            list.innerHTML += `<div class="user-card"><span>#${i+1}</span> <b>${u.name}</b> <span>💰 ${u.coins}</span></div>`;
        });
    }

    function startMatching(type) {
        const status = document.getElementById('matchStatus');
        status.innerHTML = `<h3>${type} aranıyor...</h3><div class="loader">🌀</div>`;
        setTimeout(() => {
            status.innerHTML = `<h3>Eşleşme Bulundu!</h3><div class="user-card" style="justify-content:center"><b>Simülasyon Aktif</b></div><button class="btn-main" onclick="openScreen('screenHome')">Geri Dön</button>`;
        }, 2000);
    }
</script>
</body>
</html>
