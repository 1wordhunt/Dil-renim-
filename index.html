<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Connect | Ultra Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00d2ff; --gold: #f5af19; --red: #ff3b5c; --bg: #050a0f; --panel: rgba(15, 25, 35, 0.98); }
        body { font-family: 'Rajdhani', sans-serif; margin: 0; background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }
        
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; }
        .active-screen { display: flex !important; }

        /* --- KART ARKA PLANLARI --- */
        #btnShop { background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.ibb.co/zHQQpn06/dukkas.jpg'); }
        #btnMatch { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://i.ibb.co/zHQQpn06/match.jpg'); }
        #btnWords { background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.ibb.co/zHQQpn06/telaffuz.jpg'); }
        #btnBP { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.ibb.co/zHQQpn06/1777825427839-2.jpg'); }
        #btnDaily { background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.ibb.co/zHQQpn06/soru.jpg'); }
        #btnClans { background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.ibb.co/zHQQpn06/klan.jpg'); }

        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 95%; max-width: 500px; margin-top: 50px; }
        .menu-card { 
            background-size: cover; background-position: center; border: 1px solid #333; 
            border-radius: 15px; height: 105px; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-end; padding-bottom: 8px;
            cursor: pointer; transition: 0.3s; position: relative; overflow: hidden;
            text-shadow: 2px 2px 4px #000;
        }
        .menu-card:hover { border-color: var(--neon); transform: scale(1.02); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; align-items: center; justify-content: center; }
        .modal-content { background: var(--panel); border: 2px solid var(--neon); width: 90%; max-width: 450px; border-radius: 20px; padding: 20px; position: relative; text-align: center; max-height: 85vh; overflow-y: auto; }
        .close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: var(--red); z-index: 10; font-weight: bold; }
        .btn-action { background: linear-gradient(90deg, #008cff, #00d2ff); border: none; padding: 12px; border-radius: 10px; width: 100%; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: 'Rajdhani'; }
        
        .p-frame-box { position: relative; width: 120px; height: 120px; margin: 0 auto 15px; }
        .p-img-main { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .p-frame-img { position: absolute; top: -12%; left: -12%; width: 124%; height: 124%; pointer-events: none; }
        
        .clan-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="scrLobby" class="screen active-screen">
        <div style="position:fixed; top:0; width:100%; padding:15px; display:flex; justify-content:space-between; background:rgba(0,0,0,0.8); z-index:100; box-sizing:border-box;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:40px; height:40px; position:relative;">
                    <img id="miniPImg" src="" style="width:100%; height:100%; border-radius:50%;">
                    <img id="miniFrame" src="" style="position:absolute; top:-12%; left:-12%; width:124%; height:124%;">
                </div>
                <div><b id="dispName">...</b><br><small style="color:var(--neon)">developer</small></div>
            </div>
            <div style="text-align:right">💰 <span id="dispCoins">0</span></div>
        </div>

        <div class="grid-container">
            <div id="btnShop" class="menu-card" style="grid-column: span 2;" onclick="openModal('modalShop')"><h4>DÜKKAN</h4></div>
            <div id="btnMatch" class="menu-card" style="grid-column: span 2;" onclick="openMatchmakingPref()"><h4>EŞLEŞME BAŞLAT</h4></div>
            <div id="btnWords" class="menu-card" onclick="openModal('modalWords')"><h4>TELAFFUZ AI</h4></div>
            <div id="btnBP" class="menu-card" onclick="openModal('modalBP')"><h4>BATTLE PASS</h4></div>
            <div id="btnDaily" class="menu-card" onclick="openModal('modalDaily')"><h4>GÜNLÜK SORU</h4></div>
            <div id="btnClans" class="menu-card" onclick="openModal('modalClans')"><h4>KLANLAR</h4></div>
            <div class="menu-card" style="grid-column: span 2; background-color:#111;" onclick="switchTab('scrProfile')"><h4>PROFİLİM</h4></div>
        </div>
    </div>

    <div id="modalClans" class="modal"><div class="modal-content">
        <span class="close-x" onclick="closeModal()">×</span>
        <h2>KLAN SİSTEMİ</h2>
        <div style="background: rgba(255,255,255,0.02); padding: 10px; border-radius: 10px;">
            <input type="text" id="clanNameInput" class="btn-action" style="background:#000; text-align:left" placeholder="Klan Adı Yaz...">
            <input type="file" id="clanImgFile" accept="image/*" style="display:none;" onchange="handleClanImg(this)">
            <button class="btn-action" style="background:var(--gold); color:#000;" onclick="document.getElementById('clanImgFile').click()">KLAN LOGOSU SEÇ</button>
            <button class="btn-action" onclick="createClan()">YENİ KLAN KUR</button>
        </div>
        <div id="clanListArea" style="margin-top: 15px;"></div>
    </div></div>

    <div id="scrProfile" class="screen">
        <div class="modal-content">
            <span class="close-x" onclick="switchTab('scrLobby')">×</span>
            <div class="p-frame-box">
                <img id="pImg" src="" class="p-img-main">
                <img id="pFrame" src="" class="p-frame-img">
            </div>
            <h2 id="profName">...</h2>
            <input type="file" id="pImgFile" accept="image/*" style="display:none;" onchange="uploadProfileImg(this)">
            <button class="btn-action" onclick="document.getElementById('pImgFile').click()">GALERİDEN RESMİ DEĞİŞTİR</button>
            <button class="btn-action" style="background:var(--red)" onclick="logout()">ÇIKIŞ YAP</button>
        </div>
    </div>

    <script type="module">
    // Firebase yapılandırması ve tüm fonksiyonlar (createClan, uploadProfileImg, startMatching vb.) 
    // bir önceki mesajdakiyle birebir aynıdır kanka.
</script>
</body>
</html>
