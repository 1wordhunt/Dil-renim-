<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Connect | Neon Nitro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --discord: #5865F2; --neon-purple: #bc13fe; --neon-blue: #00f3ff; --gold: #f5af19; --bg: #0b0e11; --panel: #1e1f22; }
        body { font-family: 'Rajdhani', sans-serif; margin: 0; background: var(--bg); color: #dbdee1; height: 100vh; overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; position: absolute; }
        .active-screen { display: flex !important; }

        /* NEON NITRO PROFILE */
        .nitro-card { background: var(--panel); width: 90%; max-width: 380px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #333; box-shadow: 0 0 15px rgba(188, 19, 254, 0.3); }
        .nitro-banner { height: 110px; background: linear-gradient(45deg, var(--neon-purple), var(--neon-blue)); background-size: cover; cursor: pointer; position: relative; }
        .nitro-avatar-wrap { position: absolute; top: 70px; left: 20px; width: 85px; height: 85px; background: var(--panel); border-radius: 50%; padding: 5px; }
        .nitro-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--panel); }
        .nitro-content { padding: 55px 20px 20px; text-align: left; }
        .nitro-bio-box { background: #111; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 3px solid var(--neon-blue); }

        /* KLANLAR SIRALAMA */
        .clan-item { background: #111; padding: 12px; margin: 5px 0; border-radius: 8px; display: flex; justify-content: space-between; border: 1px solid #222; }
        .clan-rank { color: var(--gold); font-weight: bold; margin-right: 10px; }

        /* MODALS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.97); z-index: 5000; align-items: center; justify-content: center; }
        .modal-content { background: var(--panel); width: 90%; max-width: 400px; border-radius: 20px; padding: 20px; text-align: center; border: 1px solid var(--neon-purple); }
        
        .btn-action { background: var(--discord); border: none; padding: 12px; border-radius: 8px; width: 100%; color: #fff; font-weight: bold; cursor: pointer; margin-top: 8px; box-shadow: 0 0 10px rgba(88, 101, 242, 0.4); }
        .auth-input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; }
        
        /* VIDEO MATCH UI */
        .video-box { width: 100%; height: 100%; background: #000; position: relative; }
        #remoteVid { width: 100%; height: 100%; object-fit: cover; }
        #localVid { width: 100px; height: 140px; position: absolute; top: 20px; right: 20px; border-radius: 10px; border: 2px solid var(--neon-blue); }
    </style>
</head>
<body>

    <div id="scrAuth" class="screen active-screen">
        <div class="modal-content">
            <h2 style="font-family:'Orbitron'; color: var(--neon-blue);">NEXUS NITRO</h2>
            <input type="text" id="uName" class="auth-input" placeholder="Kullanıcı Adı">
            <input type="email" id="uEmail" class="auth-input" placeholder="E-posta">
            <input type="password" id="uPass" class="auth-input" placeholder="Şifre">
            <div style="display:flex; gap:5px;">
                <input type="number" id="uAge" class="auth-input" style="width:33%;" placeholder="Yaş">
                <select id="uGender" class="auth-input" style="width:33%;"><option value="Erkek">Erkek</option><option value="Kız">Kız</option></select>
                <select id="uCountry" class="auth-input" style="width:34%;"><option value="Türkiye">TR 🇹🇷</option><option value="ABD">US 🇺🇸</option></select>
            </div>
            <button class="btn-action" onclick="handleAuth()">BAŞLAT</button>
        </div>
    </div>

    <div id="scrLobby" class="screen">
        <div style="position:fixed; top:0; width:100%; padding:15px; display:flex; justify-content:space-between; background:var(--panel); border-bottom:1px solid #333; z-index:100;">
            <b>NEXUS NITRO</b>
            <div>💰 <span id="dispCoins">0</span> | XP: <span id="dispXp">0</span></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:95%; margin-top:60px;">
            <div class="btn-action" style="grid-column:span 2; padding:20px;" onclick="openModal('modalMatchPref')">GÖRÜNTÜLÜ EŞLEŞME</div>
            <button class="btn-action" onclick="openModal('modalWords')">TELAFFUZ AI</button>
            <button class="btn-action" onclick="openModal('modalDaily')">GÜNLÜK SORU</button>
            <button class="btn-action" onclick="openModal('modalBP')">BATTLE PASS</button>
            <button class="btn-action" onclick="openModal('modalClans')">KLANLAR</button>
            <div class="btn-action" style="grid-column:span 2; background:#2b2d31;" onclick="switchTab('scrProfile')">PROFİL & ARA</div>
        </div>
    </div>

    <div id="scrProfile" class="screen">
        <div class="nitro-card">
            <div id="pBanner" class="nitro-banner" onclick="document.getElementById('fBanner').click()"></div>
            <div class="nitro-avatar-wrap"><img id="pImg" src="" class="nitro-avatar" onclick="document.getElementById('fAvatar').click()"></div>
            <div class="nitro-content">
                <h2 id="profName" style="margin:0;">...</h2>
                <div id="profMeta" style="font-size:12px; color:var(--neon-blue);">...</div>
                <div class="nitro-bio-box">
                    <div style="font-size:11px; font-weight:bold; color:#aaa;">HAKKIMDA</div>
                    <div id="profBioText">Yükleniyor...</div>
                </div>
                <button class="btn-action" style="background:#4e5058; margin-top:10px;" onclick="openModal('modalEditProfile')">PROFİLİ DÜZENLE</button>
                <button class="btn-action" onclick="openModal('modalSearch')">ÜYE ARA</button>
                <button class="btn-action" style="background:#333;" onclick="switchTab('scrLobby')">GERİ</button>
            </div>
        </div>
    </div>

    <div id="scrVideo" class="screen">
        <div class="video-box">
            <video id="remoteVid" autoplay playsinline></video>
            <video id="localVid" autoplay muted playsinline></video>
            <div id="matchInfo" style="position:absolute; bottom:120px; left:20px; background:rgba(0,0,0,0.8); padding:10px; border-radius:10px; display:none; border-left:4px solid var(--neon-blue);">
                <h3 id="mName" style="margin:0;">...</h3>
                <small id="mDetails">...</small>
            </div>
            <div style="position:absolute; bottom:30px; width:100%; display:flex; justify-content:center; gap:20px;">
                <button class="btn-action" style="width:60px; height:60px; border-radius:50%; background:#ff3b5c;" onclick="endCall()">🔚</button>
            </div>
        </div>
    </div>

    <div id="modalClans" class="modal"><div class="modal-content">
        <h3>KLAN SIRALAMASI</h3>
        <input type="text" id="clanNameIn" class="auth-input" placeholder="Klan Adı">
        <button class="btn-action" onclick="createClan()">KLAN KUR (500 💰)</button>
        <div id="clanList" style="margin-top:15px; text-align:left;"></div>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">KAPAT</button>
    </div></div>

    <div id="modalEditProfile" class="modal"><div class="modal-content">
        <h3>PROFİLİ DÜZENLE</h3>
        <textarea id="bioEditIn" class="auth-input" rows="3" placeholder="Hakkında bir şeyler yaz..."></textarea>
        <p style="font-size:11px;">Banner ve Avatarı profil sayfasında resimlere tıklayarak değiştir!</p>
        <button class="btn-action" onclick="saveProfile()">KAYDET</button>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">İPTAL</button>
    </div></div>

    <div id="modalWords" class="modal"><div class="modal-content">
        <h2>TELAFFUZ AI</h2>
        <h1 id="targetWord" style="color:var(--neon-blue);">EXCELLENT</h1>
        <button class="btn-action" id="micBtn" onclick="startRecognition()">🎤 KONUŞ (XP KAZAN)</button>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">KAPAT</button>
    </div></div>

    <input type="file" id="fAvatar" style="display:none;" onchange="upImg('pImg')">
    <input type="file" id="fBanner" style="display:none;" onchange="upImg('pBanner')">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, update, set, increment, push, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        databaseURL: "https://nexus-b73be-default-rtdb.firebaseio.com",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = () => document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    window.switchTab = (id) => { closeModal(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); };

    // --- AUTH ---
    window.handleAuth = async () => {
        const e = document.getElementById('uEmail').value, p = document.getElementById('uPass').value, n = document.getElementById('uName').value;
        const a = document.getElementById('uAge').value, g = document.getElementById('uGender').value, c = document.getElementById('uCountry').value;
        try {
            const res = await createUserWithEmailAndPassword(auth, e, p);
            await set(ref(db, 'users/' + res.user.uid), { username: n, age: a, gender: g, country: c, bio: "Nexus Üyesi", coins: 1000, xp: 0, pImg: "", pBanner: "" });
            await set(ref(db, 'usernames/' + n.toLowerCase()), res.user.uid);
        } catch { await signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message)); }
    };

    onAuthStateChanged(auth, user => {
        if(user) {
            switchTab('scrLobby');
            onValue(ref(db, 'users/' + user.uid), s => {
                const d = s.val(); window.uData = d;
                document.getElementById('dispCoins').innerText = d.coins;
                document.getElementById('dispXp').innerText = d.xp;
                document.getElementById('profName').innerText = d.username;
                document.getElementById('profMeta').innerText = `${d.age} Yaş | ${d.gender} | ${d.country}`;
                document.getElementById('profBioText').innerText = d.bio;
                document.getElementById('pImg').src = d.pImg || "https://via.placeholder.com/150";
                document.getElementById('pBanner').style.backgroundImage = d.pBanner ? `url(${d.pBanner})` : "none";
            });
            loadClans();
        } else { switchTab('scrAuth'); }
    });

    // --- KLANLAR (SIRALAMA SİSTEMİ) ---
    window.createClan = () => {
        const name = document.getElementById('clanNameIn').value;
        if(uData.coins < 500) return alert("Coin yetersiz!");
        const newC = push(ref(db, 'clans'));
        set(newC, { name: name, xp: 0, leader: uData.username });
        update(ref(db, 'users/'+auth.currentUser.uid), { coins: increment(-500) });
    };

    function loadClans() {
        const clanRef = query(ref(db, 'clans'), orderByChild('xp'), limitToLast(10));
        onValue(clanRef, s => {
            const list = document.getElementById('clanList'); list.innerHTML = "";
            let clans = [];
            s.forEach(c => clans.push(c.val()));
            clans.reverse().forEach((c, i) => {
                list.innerHTML += `<div class="clan-item"><span><span class="clan-rank">#${i+1}</span> ${c.name}</span> <span>${c.xp} XP</span></div>`;
            });
        });
    }

    // --- TELAFFUZ AI ---
    window.startRecognition = async () => {
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'en-US';
            document.getElementById('micBtn').innerText = "Dinleniyor...";
            rec.onresult = (e) => {
                const speech = e.results[0][0].transcript.toLowerCase();
                if(speech === "excellent") {
                    alert("Harika! +50 XP");
                    update(ref(db, 'users/'+auth.currentUser.uid), { xp: increment(50) });
                } else alert("Anlaşılan: " + speech);
                document.getElementById('micBtn').innerText = "🎤 KONUŞ (XP KAZAN)";
            };
            rec.start();
        } catch { alert("Mikrofon izni şart!"); }
    };

    // --- PROFİL DÜZENLEME ---
    window.saveProfile = () => {
        update(ref(db, 'users/'+auth.currentUser.uid), { bio: document.getElementById('bioEditIn').value });
        closeModal();
    };

    window.upImg = (type) => {
        const file = type === 'pImg' ? document.getElementById('fAvatar').files[0] : document.getElementById('fBanner').files[0];
        const reader = new FileReader();
        reader.onload = (e) => update(ref(db, 'users/'+auth.currentUser.uid), { [type]: e.target.result });
        reader.readAsDataURL(file);
    };

    // --- EŞLEŞME ---
    window.startMatch = async (pref) => {
        switchTab('scrVideo');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVid').srcObject = stream;
        setTimeout(() => {
            document.getElementById('matchInfo').style.display = 'block';
            document.getElementById('mName').innerText = pref === 'Kız' ? "Eda" : "Burak";
            document.getElementById('mDetails').innerText = "20 Yaş | Türkiye";
        }, 3000);
    };
</script>
</body>
</html>
