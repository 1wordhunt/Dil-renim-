<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v27 | Global Nexus</title>
    <style>
        :root { --bg: #000; --accent: #66fcf1; --gold: #f5af19; --red: #ff3b5c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; }
        .active { display: flex !important; }
        
        /* Matching UI */
        .match-timer { font-size: 24px; color: var(--red); font-weight: bold; text-align: center; padding: 10px; }
        .match-video { flex: 1; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .match-actions { display: flex; gap: 10px; padding: 20px; background: #111; }
        
        /* Leaderboard */
        .rank-list { padding: 15px; }
        .rank-item { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); margin-bottom: 5px; border-radius: 10px; }

        /* General UI */
        .top-bar { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="screenHome" class="screen active">
    <div class="top-bar">
        <div onclick="openScreen('screenProfile')">👤 <b id="nDisplay">Yükleniyor...</b></div>
        <div>💰 <span id="myCoins">0</span> | ⭐ <span id="myXP">0</span></div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:15px;">
        <button class="btn-main" onclick="startMatching()" style="height:100px; background:#2ecc71">📹 GLOBAL MATCHING</button>
        <button class="btn-main" onclick="openScreen('screenPronounce')" style="height:100px; background:#3498db">🗣️ TELAFFUZ ODASI</button>
        <button class="btn-main" onclick="openScreen('screenLeaderboard')" style="height:100px; background:var(--gold); grid-column: span 2">🏆 DÜNYA SIRALAMASI</button>
    </div>
</div>

<div id="screenMatching" class="screen">
    <div class="match-timer" id="matchClock">60s</div>
    <div class="match-video">
        <div id="matchSearchUI">🌐 Dünya taranıyor...</div>
        <div id="remoteUser" style="display:none; text-align:center;">
            <img id="matchImg" src="" style="width:150px; border-radius:50%; border:3px solid var(--accent)">
            <h2 id="matchUser">Yabancı</h2>
            <p id="matchCountry">USA</p>
        </div>
    </div>
    <div class="match-actions">
        <button class="btn-gold" onclick="extendTime()">⏱️ +30sn (30 Coin)</button>
        <button class="btn-main" style="background:var(--red)" onclick="endMatch()">AYRIL</button>
    </div>
</div>

<div id="screenLeaderboard" class="screen">
    <div class="top-bar"><span onclick="openScreen('screenHome')">⬅️</span> <b>DÜNYA AKTİFLİK SIRALAMASI</b></div>
    <div id="rankList" class="rank-list">
        </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get, update, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        storageBucket: "nexus-b73be.firebasestorage.app",
        messagingSenderId: "364035825759",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    let userData = null;
    let timerInterval = null;
    let timeLeft = 60;

    // --- SİSTEM BAŞLATMA & XP KAZANIMI ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            onValue(ref(db, 'users/' + user.uid), (snap) => {
                userData = snap.val();
                document.getElementById('nDisplay').innerText = userData.username + " (Dev)";
                document.getElementById('myCoins').innerText = userData.coins;
                document.getElementById('myXP').innerText = userData.xp;
            });

            // Aktiflik için saniye başı XP (Pasif Kazanç)
            setInterval(() => {
                if(userData) {
                    update(ref(db, 'users/' + user.uid), { xp: userData.xp + 1 });
                }
            }, 1000);

            loadLeaderboard();
        } else {
            // Giriş ekranına yönlendir...
        }
    });

    // --- GLOBAL MATCHING SİSTEMİ ---
    window.startMatching = async () => {
        openScreen('screenMatching');
        timeLeft = 60;
        document.getElementById('matchClock').innerText = "60s";
        
        // Simülasyon: Rastgele biriyle eşleşme
        setTimeout(() => {
            document.getElementById('matchSearchUI').style.display = 'none';
            document.getElementById('remoteUser').style.display = 'block';
            document.getElementById('matchUser').innerText = "Alex " + (Math.random() > 0.5 ? "🇺🇸" : "🇬🇧");
            document.getElementById('matchImg').src = "https://i.pravatar.cc/150?u=" + Math.random();
            
            startTimer();
        }, 2000);
    };

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('matchClock').innerText = timeLeft + "s";
            if(timeLeft <= 0) endMatch();
        }, 1000);
    }

    window.extendTime = () => {
        if(userData.coins >= 30) {
            update(ref(db, 'users/' + auth.currentUser.uid), { coins: userData.coins - 30 });
            timeLeft += 30;
            alert("Süre uzatıldı kanka!");
        } else {
            alert("Coinin yetersiz!");
        }
    };

    window.endMatch = () => {
        clearInterval(timerInterval);
        // Tur sonu ödülü
        update(ref(db, 'users/' + auth.currentUser.uid), { 
            coins: userData.coins + 5,
            xp: userData.xp + 50 
        });

        // AI Hata Söylüyor (Tarayıcı Seslendirmesi)
        const msg = new SpeechSynthesisUtterance("Tur bitti kanka. Cümlelerindeki telaffuz hataları tespit edildi. Özellikle 'The' kelimesine dikkat et.");
        msg.lang = 'tr-TR';
        window.speechSynthesis.speak(msg);

        alert("Tur Bitti! +5 Coin ve XP kazandın. Hataların sesli olarak bildirildi.");
        openScreen('screenHome');
    };

    // --- DÜNYA SIRALAMASI (LEADERBOARD) ---
    function loadLeaderboard() {
        const rankRef = query(ref(db, 'users'), orderByChild('xp'), limitToLast(10));
        onValue(rankRef, (snap) => {
            const list = document.getElementById('rankList');
            list.innerHTML = "";
            let ranks = [];
            snap.forEach(child => { ranks.push(child.val()); });
            ranks.reverse().forEach((u, i) => {
                list.innerHTML += `<div class="rank-item">
                    <span>#${i+1} ${u.username}</span>
                    <span style="color:var(--gold)">${u.xp} XP</span>
                </div>`;
            });
        });
    }

    window.openScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };
</script>
</body>
            </html>
