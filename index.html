<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --blue: #0095f6; --dark: #121212; --card: #262626; --text: #fafafa; --yellow: #ffcc00; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--dark); color: var(--text); overflow: hidden; }
        
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex; }

        /* HEADER */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid #363636; background: #000; }
        .p-circle { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--blue); cursor: pointer; object-fit: cover; }

        /* MENU GRID (WEPLAY STYLE) */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; flex: 1; }
        .menu-item { border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.2s; border: 1px solid #363636; }
        .item-lg { grid-column: span 2; height: 100px; background: #ed4956; }
        .item-mid { height: 140px; }

        /* INSTAGRAM STYLE CHAT (DM) */
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 15px; border-radius: 20px; font-size: 14px; line-height: 1.4; }
        .msg.sent { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-start; background: var(--card); border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #363636; background: #000; }
        .chat-input { flex: 1; background: transparent; border: 1px solid #363636; border-radius: 20px; padding: 8px 15px; color: white; outline: none; }

        /* AUTH & MODALS */
        .auth-box { margin: auto; width: 80%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #363636; background: #1a1a1a; color: white; box-sizing: border-box; }
        .btn-blue { background: var(--blue); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        
        /* SHOP */
        .shop-row { display: flex; gap: 15px; overflow-x: auto; padding: 15px; }
        .shop-card { min-width: 140px; background: var(--card); padding: 15px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div class="auth-box">
        <h1 style="font-style: italic;">LangMatch</h1>
        <input type="text" id="authName" placeholder="Kullanıcı Adı">
        <input type="email" id="authEmail" placeholder="E-posta">
        <input type="password" id="authPass" placeholder="Şifre">
        <button class="btn-blue" onclick="handleAuth()">Giriş Yap / Kaydol</button>
    </div>
</div>

<div id="screenDash" class="screen">
    <div class="header">
        <img id="myAvatar" src="https://via.placeholder.com/150" class="p-circle" onclick="showScreen('screenProfile')">
        <div style="color: var(--yellow);">💰 <span id="dashCoins">500</span></div>
        <div onclick="showScreen('screenFriends')" style="cursor:pointer; font-size: 20px;">✉️</div>
    </div>
    <div class="menu-grid">
        <div class="menu-item item-lg" onclick="openGlobalChat()">💬 GLOBAL CHAT</div>
        <div class="menu-item item-mid" style="background: #58cc02;" onclick="showScreen('screenMatchOptions')">📹 MATCH</div>
        <div class="menu-item item-mid" style="background: var(--yellow); color: black;" onclick="showScreen('screenShop')">🛒 SHOP</div>
        <div class="menu-item item-lg" style="background: var(--blue);" onclick="alert('Sıralama')">🏆 RANKING</div>
    </div>
</div>

<div id="screenFriends" class="screen">
    <div class="header">
        <span onclick="showScreen('screenDash')" style="cursor:pointer;">⬅️ Messages</span>
        <span style="font-weight: bold;">Direct</span>
        <span></span>
    </div>
    <div class="chat-container" id="dmList">
        <div onclick="openChat('Developer Ali')" style="display:flex; align-items:center; gap:10px; cursor:pointer;">
            <img src="https://via.placeholder.com/50" class="p-circle">
            <div><b>Developer Ali</b><br><span style="font-size:12px; color:gray;">Aktif 5dk önce</span></div>
        </div>
    </div>
</div>

<div id="screenChatArea" class="screen">
    <div class="header">
        <span onclick="showScreen('screenFriends')" style="cursor:pointer;">⬅️</span>
        <b id="chatTargetName">Target</b>
        <span style="color: var(--blue);">Detay</span>
    </div>
    <div class="chat-container" id="messages">
        <div class="msg received">Selam! Uygulama harika gidiyor.</div>
        <div class="msg sent">Teşekkürler dostum!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" class="chat-input" id="msgInput" placeholder="Mesaj yaz...">
        <button style="background:none; border:none; color:var(--blue); font-weight:bold;" onclick="sendMessage()">Gönder</button>
    </div>
</div>

<div id="screenShop" class="screen">
    <div class="header"><span onclick="showScreen('screenDash')">⬅️ Dükkan</span></div>
    <div class="shop-row">
        <div class="shop-card">
            <div style="font-size:40px;">🖼️</div>
            <p>Mavi Çerçeve</p>
            <button class="btn-blue">200 💰</button>
        </div>
        <div class="shop-card">
            <div style="font-size:40px;">💎</div>
            <p>Premium Üyelik</p>
            <button class="btn-blue">1000 💰</button>
        </div>
    </div>
</div>

<div id="screenProfile" class="screen">
    <div class="header"><span onclick="showScreen('screenDash')">⬅️ Profil</span></div>
    <div style="text-align:center; padding:20px;">
        <img id="pImgBig" src="https://via.placeholder.com/150" style="width:120px; height:120px; border-radius:50%; border:3px solid var(--blue);">
        <h2 id="pName">Kullanıcı</h2>
        <button class="btn-blue" onclick="document.getElementById('fileInp').click()">Fotoğraf Değiştir</button>
        <input type="file" id="fileInp" style="display:none" onchange="uploadPhoto(this)">
        <br><br>
        <button class="btn-blue" style="background:red;" onclick="logout()">Çıkış Yap</button>
    </div>
</div>

<script>
    let currentUser = null;

    // AUTH SİSTEMİ (LocalStorage ile Kayıt)
    function handleAuth() {
        const name = document.getElementById('authName').value;
        const pass = document.getElementById('authPass').value;
        const email = document.getElementById('authEmail').value;

        if(!name || !pass) return alert("Bilgileri doldur!");

        const savedUser = JSON.parse(localStorage.getItem('user_' + name));

        if(savedUser) {
            if(savedUser.pass === pass) {
                login(savedUser);
            } else {
                alert("Hatalı Şifre!");
            }
        } else {
            // Yeni Kayıt
            const newUser = { name, pass, email, coins: 500, avatar: 'https://via.placeholder.com/150' };
            localStorage.setItem('user_' + name, JSON.stringify(newUser));
            login(newUser);
        }
    }

    function login(user) {
        currentUser = user;
        document.getElementById('pName').innerText = user.name;
        document.getElementById('dashCoins').innerText = user.coins;
        document.getElementById('myAvatar').src = user.avatar;
        document.getElementById('pImgBig').src = user.avatar;
        showScreen('screenDash');
    }

    function logout() { location.reload(); }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function uploadPhoto(inp) {
        if (inp.files && inp.files[0]) {
            let r = new FileReader();
            r.onload = e => {
                const img = e.target.result;
                document.getElementById('myAvatar').src = img;
                document.getElementById('pImgBig').src = img;
                currentUser.avatar = img;
                localStorage.setItem('user_' + currentUser.name, JSON.stringify(currentUser));
            };
            r.readAsDataURL(inp.files[0]);
        }
    }

    // INSTAGRAM STYLE DM
    function openChat(name) {
        document.getElementById('chatTargetName').innerText = name;
        showScreen('screenChatArea');
    }

    function sendMessage() {
        const txt = document.getElementById('msgInput').value;
        if(!txt) return;
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg sent';
        msgDiv.innerText = txt;
        document.getElementById('messages').appendChild(msgDiv);
        document.getElementById('msgInput').value = '';
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function openGlobalChat() {
        alert("Global Chat açılıyor... Instagram stili DM sistemini 'Messages' (✉️) kısmından test edebilirsin!");
    }
</script>

</body>
</html>
