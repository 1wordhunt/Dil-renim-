<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus: Brawl Nitro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --discord: #5865F2; --neon: #00f3ff; --gold: #f5af19; --bg: #0b0e11; --panel: #1e1f22; --bs-yellow: #fff200; }
        body { font-family: 'Rajdhani', sans-serif; margin: 0; background: var(--bg); color: #dbdee1; height: 100vh; overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; position: absolute; }
        .active-screen { display: flex !important; }

        /* BATTLE PASS (BRAWL STYLE) */
        .bp-container { width: 100%; overflow-x: auto; display: flex; gap: 15px; padding: 20px; background: #2c3e50; border-radius: 15px; }
        .bp-tier { min-width: 90px; height: 120px; background: #34495e; border: 3px solid #1a252f; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .bp-unlocked { border-color: var(--bs-yellow); box-shadow: 0 0 10px var(--bs-yellow); }
        .tier-label { position: absolute; top: -10px; background: #e74c3c; padding: 2px 8px; border-radius: 10px; font-size: 12px; }

        /* MATCHING & VIDEO */
        .video-box { width: 100%; height: 100%; background: #000; position: relative; }
        #remoteVid { width: 100%; height: 100%; object-fit: cover; }
        #localVid { width: 100px; height: 140px; position: absolute; top: 20px; right: 20px; border-radius: 10px; border: 2px solid var(--neon); }
        .video-controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 15px; }
        .ctrl-btn { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* CHAT OVERLAY */
        #chatOverlay { position: absolute; bottom: 100px; left: 10px; right: 10px; max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 10px; display: none; }

        .btn-action { background: var(--discord); border: none; padding: 12px; border-radius: 8px; width: 100%; color: #fff; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .auth-input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="scrAuth" class="screen active-screen">
        <div style="background:var(--panel); padding:25px; border-radius:20px; width:85%; max-width:350px; text-align:center; border:1px solid var(--neon);">
            <h1 style="font-family:'Orbitron'; color:var(--neon); margin:0 0 15px 0;">NEXUS</h1>
            <input type="text" id="uName" class="auth-input" placeholder="Kullanıcı Adı">
            <input type="email" id="uEmail" class="auth-input" placeholder="E-posta">
            <input type="password" id="uPass" class="auth-input" placeholder="Şifre">
            <div style="display:flex; gap:5px;">
                <input type="number" id="uAge" class="auth-input" style="width:33%;" placeholder="Yaş">
                <select id="uGender" class="auth-input" style="width:33%;"><option value="Erkek">Erkek</option><option value="Kız">Kız</option></select>
                <select id="uCountry" class="auth-input" style="width:34%;"><option value="Türkiye">TR 🇹🇷</option></select>
            </div>
            <button class="btn-action" onclick="handleAuth()">KATIL (+500 💰)</button>
        </div>
    </div>

    <div id="scrLobby" class="screen">
        <div style="position:fixed; top:0; width:100%; padding:15px; display:flex; justify-content:space-between; background:var(--panel); border-bottom:1px solid #333; z-index:100;">
            <b style="color:var(--neon)">NEXUS</b>
            <div>💰 <span id="dispCoins">0</span> | XP: <span id="dispXp">0</span></div>
        </div>
        
        <div style="width:95%; margin-top:60px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button class="btn-action" style="grid-column:span 2; padding:25px; font-size:18px;" onclick="startMatching()">GÖRÜNTÜLÜ EŞLEŞME</button>
            <button class="btn-action" onclick="openModal('modalDaily')">GÜNLÜK SORU</button>
            <button class="btn-action" onclick="openModal('modalWords')">TELAFFUZ AI</button>
            <button class="btn-action" onclick="openModal('modalBP')">BATTLE PASS</button>
            <button class="btn-action" onclick="openModal('modalClans')">KLANLAR (590💰)</button>
            <button class="btn-action" style="grid-column:span 2; background:#2b2d31;" onclick="switchTab('scrProfile')">PROFİLİM & ÜYE ARA</button>
        </div>
    </div>

    <div id="scrMatch" class="screen">
        <div class="video-box">
            <video id="remoteVid" autoplay playsinline></video>
            <video id="localVid" autoplay muted playsinline></video>
            
            <div id="chatOverlay"></div>

            <div class="video-controls">
                <button class="ctrl-btn" id="btnCam" onclick="toggleCam()">📷</button>
                <button class="ctrl-btn" id="btnMic" onclick="toggleMic()">🎤</button>
                <button class="ctrl-btn" style="background:var(--discord);" onclick="openChat()">💬</button>
                <button class="ctrl-btn" style="background:red;" onclick="stopMatching()">🔚</button>
            </div>
        </div>
    </div>

    <div id="modalBP" class="modal"><div class="modal-content" style="max-width:95%; background:#1a252f;">
        <h2 style="color:var(--bs-yellow);">NEXUS PASS</h2>
        <div class="bp-container" id="bpTrack"></div>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">GERİ</button>
    </div></div>

    <div id="modalDaily" class="modal"><div class="modal-content">
        <h3>GÜNLÜK KELİME</h3>
        <p id="qText">Yükleniyor...</p>
        <input type="text" id="qAns" class="auth-input" placeholder="Türkçesi nedir?">
        <button class="btn-action" onclick="checkDaily()">CEVAPLA</button>
        <button class="btn-action" style="background:#444;" onclick="closeModal()">KAPAT</button>
    </div></div>

    <div id="modalSearch" class="modal"><div class="modal-content">
        <h3>ÜYE ARA</h3>
        <input type="text" id="srchIn" class="auth-input" placeholder="Kullanıcı adı...">
        <button class="btn-action" onclick="searchUser()">PROFİLİNE BAK</button>
        <div id="srchRes"></div>
    </div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, update, set, increment, push, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        databaseURL: "https://nexus-b73be-default-rtdb.firebaseio.com",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = () => document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    window.switchTab = (id) => { closeModal(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); };

    // --- AUTH & INITIAL COINS ---
    window.handleAuth = async () => {
        const e = document.getElementById('uEmail').value, p = document.getElementById('uPass').value, n = document.getElementById('uName').value;
        const a = document.getElementById('uAge').value, g = document.getElementById('uGender').value;
        try {
            const res = await createUserWithEmailAndPassword(auth, e, p);
            await set(ref(db, 'users/' + res.user.uid), { 
                username: n, age: a, gender: g, coins: 500, xp: 0, 
                lastDaily: 0, bio: "Nexus Connect Üyesi", pImg: "", pBanner: "" 
            });
            await set(ref(db, 'usernames/' + n.toLowerCase()), res.user.uid);
        } catch { await signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message)); }
    };

    onAuthStateChanged(auth, user => {
        if(user) {
            switchTab('scrLobby');
            onValue(ref(db, 'users/' + user.uid), s => {
                const d = s.val(); window.uData = d;
                document.getElementById('dispCoins').innerText = d.coins;
                document.getElementById('dispXp').innerText = d.xp;
                renderBP(d.xp);
            });
        } else { switchTab('scrAuth'); }
    });

    // --- BATTLE PASS (BRAWL STYLE) ---
    function renderBP(currentXp) {
        const track = document.getElementById('bpTrack');
        track.innerHTML = "";
        for(let i=1; i<=15; i++) {
            const need = i * 250;
            const isOk = currentXp >= need;
            track.innerHTML += `
                <div class="bp-tier ${isOk ? 'bp-unlocked' : ''}">
                    <div class="tier-label">LVL ${i}</div>
                    <span style="font-size:24px;">${i % 3 == 0 ? '💎' : '💰'}</span>
                    <small>${isOk ? 'ALINDI' : need + ' XP'}</small>
                </div>`;
        }
    }

    // --- GÜNLÜK SORU (24 SAAT) ---
    const dailyWords = [{en: "Success", tr: "Başarı"}, {en: "Future", tr: "Gelecek"}, {en: "Developer", tr: "Geliştirici"}];
    window.checkDaily = () => {
        const now = Date.now();
        if(now - (uData.lastDaily || 0) < 86400000) return alert("Soru için 24 saat beklemelisin!");
        const ans = document.getElementById('qAns').value.toLowerCase();
        if(ans === "başarı") { // Örnek kelime cevabı
            update(ref(db, 'users/'+auth.currentUser.uid), { xp: increment(150), lastDaily: now });
            alert("Harika! +150 XP Kazandın.");
            closeModal();
        } else { alert("Yanlış cevap, tekrar dene!"); }
    };

    // --- MATCHING & REAL TIME ---
    let localStream;
    window.startMatching = async () => {
        switchTab('scrMatch');
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVid').srcObject = localStream;
        
        // Firebase üzerinde "online" işaretle ve eşleşme ara
        const matchRef = ref(db, 'queue/' + auth.currentUser.uid);
        set(matchRef, {uid: auth.currentUser.uid, name: uData.username});
        
        alert("Dünya üzerinden bir rakip aranıyor...");
    };

    window.stopMatching = () => {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        set(ref(db, 'queue/' + auth.currentUser.uid), null);
        switchTab('scrLobby');
    };

    window.toggleCam = () => {
        const videoTrack = localStream.getVideoTracks()[0];
        videoTrack.enabled = !videoTrack.enabled;
        document.getElementById('btnCam').innerText = videoTrack.enabled ? "📷" : "🚫";
    };

    window.toggleMic = () => {
        const audioTrack = localStream.getAudioTracks()[0];
        audioTrack.enabled = !audioTrack.enabled;
        document.getElementById('btnMic').innerText = audioTrack.enabled ? "🎤" : "🔇";
    };

    window.openChat = () => {
        const msg = prompt("Mesajını yaz:");
        if(msg) document.getElementById('chatOverlay').innerHTML += `<div><b>Sen:</b> ${msg}</div>`;
        document.getElementById('chatOverlay').style.display = 'block';
    };

</script>
</body>
</html>
