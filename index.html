<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v13 | Nexus Elite</title>
    <style>
        :root {
            --bg: #0b0c10; --card: #1f2833; --text: #ffffff;
            --accent: #66fcf1; --gold: #f5af19; --diamond: #00d2ff;
            --neon-red: linear-gradient(135deg, #ff416c, #ff4b2b);
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; background: var(--bg); }
        .active { display: flex !important; }

        /* Üst Panel */
        .user-panel { background: #1a1a1d; margin: 10px; padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 2px solid var(--accent); position: relative; }
        
        /* ÇERÇEVE SİSTEMİ (Resim 1) */
        .avatar-wrapper { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
        .u-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; z-index: 1; }
        .u-frame-img { position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: none; }

        /* GLOBAL CHAT ÇERÇEVE (Resim 2) */
        .chat-msg-container { position: relative; margin: 10px; padding: 25px; min-height: 60px; display: flex; align-items: center; color: white; align-self: flex-start; max-width: 85%; }
        .chat-frame-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; object-fit: fill; border-radius: 10px; }
        .chat-text { position: relative; z-index: 1; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* Grid ve Butonlar */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; flex: 1; overflow-y: auto; }
        .card { border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; color: white; cursor: pointer; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-action { background: var(--accent); color: black; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 15px; margin: 8px 0; border-radius: 12px; background: #1a1a1d; border: 1px solid #333; color: white; box-sizing: border-box; }
        
        .nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div style="margin: auto; width: 85%; text-align: center;">
        <h2 style="color: var(--accent);">THE CORE: NEXUS</h2>
        <p style="font-size: 12px;">Profil Resmini Seç:</p>
        <input type="file" id="fileAvatar" accept="image/*" onchange="loadImg(this, 'uAvatar')">
        <input type="text" id="regName" placeholder="Adın">
        <button class="btn-action" onclick="handleAuth()">SİSTEME GİR</button>
    </div>
</div>

<div id="screenHome" class="screen">
    <div class="user-panel">
        <div class="avatar-wrapper">
            <img id="uAvatar" src="" class="u-img">
            <img id="uFrame" src="" class="u-frame-img">
        </div>
        <div style="flex:1">
            <div id="uNameDisp" style="font-weight:bold;">Developer</div>
            <div style="font-size:11px; color:var(--gold);">🏅 Altın Sarı</div>
        </div>
        <div style="color:var(--gold); font-weight:bold;">💰 12,500</div>
    </div>
    
    <div class="grid">
        <div class="card" style="grid-column:span 2; background: #8b0000;" onclick="openScreen('screenGlobal')">💬 GLOBAL CHAT</div>
        <div class="card" style="background: #f5af19;" onclick="openScreen('screenShop')">🛒 SHOP</div>
        <div class="card" style="background: #0277bd;" onclick="openScreen('screenPronounce')">🗣️ TELAFFUZ</div>
    </div>

    <div class="nav">
        <div onclick="openScreen('screenHome')">🏠</div>
        <div onclick="openScreen('screenShop')">🛒</div>
        <div onclick="openScreen('screenProfile')">👤</div>
    </div>
</div>

<div id="screenShop" class="screen">
    <div class="user-panel"><span onclick="openScreen('screenHome')">⬅️</span> <b>MARKET</b></div>
    <div style="padding:15px;">
        <div style="background:#25262e; padding:15px; border-radius:15px; margin-bottom:10px;">
            <p><b>1. Resimdeki Profil Çerçevesi</b></p>
            <input type="file" accept="image/*" onchange="loadImg(this, 'uFrame', true)">
            <p style="font-size:10px; color:var(--gold);">Resmi yükle ve profilden aktif et!</p>
        </div>
        <div style="background:#25262e; padding:15px; border-radius:15px;">
            <p><b>2. Resimdeki Chat Çerçevesi</b></p>
            <input type="file" accept="image/*" onchange="loadImg(this, 'chatFrameImg')">
            <p style="font-size:10px; color:var(--gold);">Global Chat'te mesajların bunun içinde gözükür.</p>
        </div>
    </div>
</div>

<div id="screenGlobal" class="screen">
    <div class="user-panel"><span onclick="openScreen('screenHome')">⬅️</span> <b>GLOBAL CHAT</b></div>
    <div id="chatBox" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:10px;"></div>
    <div style="padding:10px; display:flex; gap:5px;">
        <input type="text" id="msgInput" placeholder="Mesaj yaz...">
        <button onclick="sendMsg()" style="padding:10px; border-radius:10px; background:var(--accent);">Gönder</button>
    </div>
</div>

<div id="screenProfile" class="screen">
    <div class="user-panel"><span onclick="openScreen('screenHome')">⬅️</span> <b>PROFİL</b></div>
    <div style="text-align:center; padding-top:50px;">
        <div class="avatar-wrapper" style="width:150px; height:150px; margin:auto;">
            <img id="pAvatar" src="" style="width:90px; height:90px; border-radius:50%; z-index:1;">
            <img id="pFrame" src="" style="position:absolute; width:100%; height:100%; z-index:2; display:none;">
        </div>
        <h2 id="pName">Burak</h2>
        <button class="btn-action" style="width:80%;" onclick="toggleFrame()">ÇERÇEVEYİ AKTİF ET / KALDIR</button>
    </div>
</div>

<script>
    let images = { avatar: '', frame: '', chatFrame: '' };

    function loadImg(input, targetId, isFrame = false) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                if(targetId === 'chatFrameImg') { images.chatFrame = e.target.result; alert("Chat çerçevesi hazır!"); }
                else {
                    document.getElementById(targetId).src = e.target.result;
                    if(targetId === 'uAvatar') { document.getElementById('pAvatar').src = e.target.result; }
                    if(isFrame) { document.getElementById('pFrame').src = e.target.result; images.frame = e.target.result; }
                }
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function handleAuth() {
        const name = document.getElementById('regName').value;
        document.getElementById('uNameDisp').innerText = name + " (Dev)";
        document.getElementById('pName').innerText = name + " (Dev)";
        openScreen('screenHome');
    }

    function openScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function toggleFrame() {
        const f1 = document.getElementById('uFrame');
        const f2 = document.getElementById('pFrame');
        const isOff = f1.style.display === 'none' || f1.style.display === '';
        f1.style.display = isOff ? 'block' : 'none';
        f2.style.display = isOff ? 'block' : 'none';
    }

    function sendMsg() {
        const txt = document.getElementById('msgInput').value;
        if(!txt) return;
        const chatBox = document.getElementById('chatBox');
        
        let msgHtml = '';
        if(images.chatFrame) {
            msgHtml = `<div class="chat-msg-container">
                        <img src="${images.chatFrame}" class="chat-frame-bg">
                        <span class="chat-text"><b>Sen:</b> ${txt}</span>
                      </div>`;
        } else {
            msgHtml = `<div style="background:#333; padding:10px; border-radius:10px; margin:5px;"><b>Sen:</b> ${txt}</div>`;
        }
        
        chatBox.innerHTML += msgHtml;
        document.getElementById('msgInput').value = '';
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
