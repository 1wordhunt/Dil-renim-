<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v30 | Live Test</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000; --accent: #66fcf1; --gold: #f5af19; --red: #ff3b5c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; }
        .active { display: flex !important; }
        
        /* Auth & Profile Styles */
        .card { width: 85%; max-width: 400px; padding: 25px; background: rgba(255,255,255,0.05); border-radius: 25px; border: 1px solid var(--accent); margin: auto; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        /* Çerçeve Fix */
        .av-wrap { position: relative; width: 160px; height: 160px; margin: 20px auto; }
        .u-pic { width: 100px; height: 100px; border-radius: 50%; position: absolute; top: 30px; left: 30px; z-index: 1; object-fit: cover; background: #222; }
        .u-frame { width: 160px; height: 160px; position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }

        /* Video Styles */
        .video-container { flex: 1; position: relative; background: #111; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 100px; height: 140px; position: absolute; top: 15px; right: 15px; border: 2px solid var(--accent); border-radius: 10px; z-index: 10; transform: scaleX(-1); }
        .ui-overlay { position: absolute; bottom: 40px; width: 100%; text-align: center; z-index: 11; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div class="card">
        <h2 style="color:var(--accent)">NEXUS CONNECT</h2>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="pass" placeholder="Şifre (Min. 6 Karakter)">
        <div id="regFields" style="display:none;">
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <select id="gender">
                <option value="Erkek">Erkek</option>
                <option value="Kadın">Kadın</option>
            </select>
        </div>
        <button class="btn-main" onclick="processAuth()" id="authBtn">GİRİŞ YAP</button>
        <p onclick="toggleMode()" id="toggleTxt" style="color:var(--gold); cursor:pointer; margin-top:15px; font-size:13px;">Hesabın yok mu? Kayıt Ol</p>
    </div>
</div>

<div id="screenHome" class="screen">
    <div style="padding:15px 20px; display:flex; justify-content:space-between; align-items:center; background:#111; border-bottom: 1px solid #222;">
        <div onclick="openScreen('screenProfile')" style="cursor:pointer">👤 <b id="uDisplay">...</b></div>
        <div style="color:var(--gold)">💰 <span id="uCoins">0</span></div>
    </div>
    <div style="padding:20px; flex:1; display:flex; flex-direction:column; justify-content:center; gap:15px;">
        <button class="btn-main" style="height:120px; background:#2ecc71; font-size:18px;" onclick="startMatching()">📹 GLOBAL EŞLEŞME</button>
        <button class="btn-main" style="background:#3498db" onclick="openScreen('screenLeaderboard')">🏆 SIRALAMA</button>
        <button class="btn-main" style="background:var(--red)" onclick="location.reload()">GÜNCELLE / ÇIKIŞ</button>
    </div>
</div>

<div id="screenProfile" class="screen">
    <div style="padding:15px 20px; background:#111;"><span onclick="openScreen('screenHome')" style="cursor:pointer">⬅️ Geri</span></div>
    <div class="av-wrap">
        <img src="https://via.placeholder.com/100" class="u-pic" id="pImg">
        <img src="https://i.ibb.co/b854bda4d42c0228b4af81984c8bdd78.jpg" class="u-frame">
    </div>
    <div style="text-align:center;">
        <h2 id="pName">Burak (Dev)</h2>
        <p style="color:var(--accent)">⭐ XP: <span id="pXP">0</span></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        storageBucket: "nexus-b73be.firebasestorage.app",
        messagingSenderId: "364035825759",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let isReg = false;
    let myData = null;

    window.toggleMode = () => {
        isReg = !isReg;
        document.getElementById('regFields').style.display = isReg ? 'block' : 'none';
        document.getElementById('authBtn').innerText = isReg ? 'KAYIT OL' : 'GİRİŞ YAP';
        document.getElementById('toggleTxt').innerText = isReg ? 'Giriş Yap' : 'Kayıt Ol';
    };

    window.processAuth = async () => {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('pass').value.trim();
        try {
            if(isReg) {
                const user = await createUserWithEmailAndPassword(auth, email, pass);
                await set(ref(db, 'users/' + user.user.uid), {
                    username: document.getElementById('username').value || "Oyuncu",
                    gender: document.getElementById('gender').value,
                    coins: 500, xp: 0, status: "idle"
                });
            } else {
                await signInWithEmailAndPassword(auth, email, pass);
            }
        } catch(e) { alert("Firebase Hatası: " + e.message); }
    };

    onAuthStateChanged(auth, u => {
        if(u) {
            onValue(ref(db, 'users/' + u.uid), s => {
                myData = s.val();
                document.getElementById('uDisplay').innerText = myData.username;
                document.getElementById('pName').innerText = myData.username;
                document.getElementById('uCoins').innerText = myData.coins;
                document.getElementById('pXP').innerText = myData.xp;
                openScreen('screenHome');
            });
        } else { openScreen('screenAuth'); }
    });

    window.openScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };
</script>
</body>
</html>
