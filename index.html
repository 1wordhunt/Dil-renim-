<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v28 | Real Video Connect</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000; --accent: #66fcf1; --gold: #f5af19; --red: #ff3b5c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; }
        .active { display: flex !important; }
        
        /* Görüntülü Sohbet Alanı */
        .video-container { flex: 1; position: relative; background: #111; display: flex; flex-direction: column; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #222; }
        #localVideo { width: 100px; height: 130px; position: absolute; top: 20px; right: 20px; border: 2px solid var(--accent); border-radius: 10px; z-index: 10; transform: scaleX(-1); }
        
        .match-overlay { position: absolute; bottom: 100px; width: 100%; text-align: center; z-index: 11; }
        .timer-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--red); display: inline-flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); font-weight: bold; }

        /* Formlar */
        .card { width: 85%; padding: 25px; background: rgba(255,255,255,0.05); border-radius: 25px; border: 1px solid var(--accent); margin: auto; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div class="card">
        <h2 style="color:var(--accent)">NEXUS CORE</h2>
        <div id="authForms">
            <input type="email" id="email" placeholder="E-posta">
            <input type="password" id="pass" placeholder="Şifre">
            <div id="registerFields" style="display:none;">
                <input type="text" id="username" placeholder="Kullanıcı Adı">
                <select id="gender">
                    <option value="Erkek">Erkek</option>
                    <option value="Kadın">Kadın</option>
                </select>
            </div>
            <button class="btn-main" id="btnAction" onclick="handleAuth()">GİRİŞ YAP</button>
            <p onclick="toggleAuthMode()" style="cursor:pointer; font-size:12px; margin-top:15px; color:var(--gold)" id="authToggleText">Hesabın yok mu? Kayıt Ol</p>
        </div>
    </div>
</div>

<div id="screenHome" class="screen">
    <div style="padding:20px; display:flex; justify-content:space-between; align-items:center; background:#111;">
        <b>👤 <span id="nDisplay">...</span></b>
        <div style="color:var(--gold)">💰 <span id="uCoins">0</span></div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px; gap:15px;">
        <button class="btn-main" style="height:150px; font-size:20px; background:#2ecc71" onclick="startRealMatching()">📹 GÖRÜNTÜLÜ EŞLEŞ</button>
        <button class="btn-main" onclick="openScreen('screenProfile')">PROFİL & DÜKKAN</button>
    </div>
</div>

<div id="screenMatching" class="screen">
    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
        
        <div class="match-overlay">
            <div class="timer-circle" id="mTimer">60</div>
            <div id="matchInfo" style="margin-top:10px; text-shadow: 2px 2px #000;">Eşleşme Aranıyor...</div>
        </div>

        <div style="position:absolute; bottom:20px; display:flex; width:100%; justify-content:center; gap:10px;">
            <button class="btn-main" style="width:120px; background:var(--gold)" onclick="buyExtraTime()">+30s (30💰)</button>
            <button class="btn-main" style="width:120px; background:var(--red)" onclick="stopMatching()">AYRIL</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        storageBucket: "nexus-b73be.firebasestorage.app",
        messagingSenderId: "364035825759",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    
    let peer = null;
    let localStream = null;
    let isRegister = false;
    let myData = null;
    let timerInterval = null;

    // --- AUTH SİSTEMİ ---
    window.toggleAuthMode = () => {
        isRegister = !isRegister;
        document.getElementById('registerFields').style.display = isRegister ? 'block' : 'none';
        document.getElementById('btnAction').innerText = isRegister ? 'KAYIT OL' : 'GİRİŞ YAP';
        document.getElementById('authToggleText').innerText = isRegister ? 'Zaten hesabın var mı? Giriş Yap' : 'Hesabın yok mu? Kayıt Ol';
    };

    window.handleAuth = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        try {
            if(isRegister) {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await set(ref(db, 'users/' + res.user.uid), {
                    username: document.getElementById('username').value,
                    gender: document.getElementById('gender').value,
                    coins: 500, xp: 0, status: "idle"
                });
            } else {
                await signInWithEmailAndPassword(auth, email, pass);
            }
        } catch(e) { alert(e.message); }
    };

    onAuthStateChanged(auth, u => {
        if(u) {
            onValue(ref(db, 'users/' + u.uid), s => {
                myData = s.val();
                document.getElementById('nDisplay').innerText = myData.username;
                document.getElementById('uCoins').innerText = myData.coins;
                openScreen('screenHome');
            });
        } else { openScreen('screenAuth'); }
    });

    // --- GÖRÜNTÜLÜ EŞLEŞME (PEERJS + FIREBASE) ---
    window.startRealMatching = async () => {
        openScreen('screenMatching');
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVideo').srcObject = localStream;

        peer = new Peer(auth.currentUser.uid); // Firebase UID'sini Peer ID yapıyoruz
        
        peer.on('open', (id) => {
            // "Eşleşme Bekliyor" olarak işaretle
            update(ref(db, 'users/' + auth.currentUser.uid), { status: "searching", peerId: id });
            findPartner();
        });

        peer.on('call', (call) => {
            call.answer(localStream);
            call.on('stream', (rs) => {
                document.getElementById('remoteVideo').srcObject = rs;
                startMatchTimer();
            });
        });
    };

    async function findPartner() {
        const snap = await get(ref(db, 'users'));
        snap.forEach(child => {
            const user = child.val();
            if(child.key !== auth.currentUser.uid && user.status === "searching") {
                // Eşleşme bulundu, ara!
                const call = peer.call(user.peerId, localStream);
                call.on('stream', (rs) => {
                    document.getElementById('remoteVideo').srcObject = rs;
                    update(ref(db, 'users/' + auth.currentUser.uid), { status: "busy" });
                    update(ref(db, 'users/' + child.key), { status: "busy" });
                    document.getElementById('matchInfo').innerText = "Bağlanıldı!";
                    startMatchTimer();
                });
            }
        });
    }

    function startMatchTimer() {
        let t = 60;
        timerInterval = setInterval(() => {
            t--;
            document.getElementById('mTimer').innerText = t;
            if(t <= 0) stopMatching();
        }, 1000);
    }

    window.stopMatching = () => {
        clearInterval(timerInterval);
        if(localStream) localStream.getTracks().forEach(track => track.stop());
        if(peer) peer.destroy();
        update(ref(db, 'users/' + auth.currentUser.uid), { status: "idle" });
        
        // AI Geri Bildirim Simülasyonu
        const synth = window.speechSynthesis;
        synth.speak(new SpeechSynthesisUtterance("Görüşme bitti kanka. Harika konuştun ama aksanını biraz daha geliştirmen lazım."));
        
        openScreen('screenHome');
    };

    window.openScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };
</script>
</body>
</html>
