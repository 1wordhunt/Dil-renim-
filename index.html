<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v23 | Final Fix</title>
    <style>
        :root { --bg: #000; --accent: #66fcf1; --gold: #f5af19; --red: #ff3b5c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; }
        .active { display: flex !important; }

        /* --- GARANTİ ÇÖZÜM: KATMANLI AVATAR YAPISI --- */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Profil Fotoğrafı (En Alt Katman) */
        .user-photo {
            width: 95px;
            height: 95px;
            border-radius: 50%; /* Kare fotoyu yuvarlar */
            object-fit: cover;
            z-index: 1;
            background: #111;
        }

        /* Çerçeve (En Üst Katman) */
        .frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 150px;
            height: 150px;
            z-index: 2;
            pointer-events: none; /* Tıklamayı engellemez */
            object-fit: contain;
        }

        /* Diğer UI Elemanları */
        .top-bar { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .block { border-radius: 22px; height: 110px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div style="text-align:center; padding:50px;">
        <h2 style="color:var(--accent)">NEXUS PRO</h2>
        <input type="file" id="fileInput" hidden accept="image/*" onchange="previewFile()">
        <div onclick="document.getElementById('fileInput').click()" style="width:80px; height:80px; border:2px dashed var(--accent); border-radius:50%; margin:20px auto; display:flex; align-items:center; justify-content:center; overflow:hidden;">
            <img id="regPreview" style="width:100%; height:100%; object-fit:cover; display:none;">
            <span id="plus">+</span>
        </div>
        <input type="text" id="regName" placeholder="İsim">
        <button class="btn-main" onclick="initApp()">GİRİŞ</button>
    </div>
</div>

<div id="screenHome" class="screen">
    <div class="top-bar">
        <div onclick="openScreen('screenProfile')">👤 <b id="nDisplay">Developer</b></div>
        <div style="color:var(--gold)">💰 <span id="myCoins">1500</span></div>
    </div>
    <div class="grid">
        <div class="block" style="background: #2ecc71;" onclick="alert('Eşleşme Aranıyor...')">MATCHING</div>
        <div class="block" style="background: #f1c40f;" onclick="openScreen('screenShop')">SHOP</div>
        <div class="block" style="background: var(--red); grid-column: span 2;">GLOBAL CHAT</div>
    </div>
</div>

<div id="screenShop" class="screen">
    <div class="top-bar"><span onclick="openScreen('screenHome')">⬅️ Geri</span> <b>MARKET</b></div>
    <div style="padding:15px;">
        <div style="background:#1a1a1d; padding:15px; border-radius:20px; display:flex; align-items:center; gap:15px;">
            <img src="https://i.ibb.co/BKgTg3Lc/Ba-l-ks-z.png" style="width:50px;">
            <div style="flex:1"><b>Asil Çerçeve</b></div>
            <button onclick="buy('royal')" style="background:var(--gold); border:none; padding:8px; border-radius:8px;">AL</button>
        </div>
    </div>
</div>

<div id="screenProfile" class="screen">
    <div class="top-bar"><span onclick="openScreen('screenHome')">⬅️ Geri</span> <b>PROFİL</b></div>
    
    <div class="avatar-container">
        <img id="profPic" src="" class="user-photo">
        <img id="activeFrame" src="" class="frame-overlay" style="display:none;">
    </div>

    <div style="text-align:center; padding:20px;">
        <h2 id="pName">Burak (Dev)</h2>
        <div id="inventory" style="background:#111; padding:15px; border-radius:20px;">
            <h4>ENVANTER</h4>
        </div>
    </div>
</div>

<script>
    let user = { name: '', photo: '', coins: 1500, inventory: [] };
    let db = { royal: { name: 'Asil Çerçeve', img: 'https://i.ibb.co/BKgTg3Lc/Ba-l-ks-z.png' } };

    function previewFile() {
        const reader = new FileReader();
        reader.onloadend = () => {
            user.photo = reader.result;
            document.getElementById('regPreview').src = reader.result;
            document.getElementById('regPreview').style.display = 'block';
            document.getElementById('plus').style.display = 'none';
        }
        reader.readAsDataURL(document.getElementById('fileInput').files[0]);
    }

    function initApp() {
        user.name = document.getElementById('regName').value + " (Dev)";
        document.getElementById('nDisplay').innerText = user.name;
        document.getElementById('pName').innerText = user.name;
        document.getElementById('profPic').src = user.photo || 'https://via.placeholder.com/100';
        openScreen('screenHome');
    }

    function buy(id) {
        if(!user.inventory.includes(id)) {
            user.inventory.push(id);
            updateInv();
            alert("Aldın!");
        }
    }

    function updateInv() {
        const inv = document.getElementById('inventory');
        inv.innerHTML = '<h4>ENVANTER</h4>';
        user.inventory.forEach(i => {
            inv.innerHTML += `<button class="btn-main" onclick="use('${i}')">${db[i].name} TAK</button>`;
        });
    }

    function use(id) {
        const f = document.getElementById('activeFrame');
        f.src = db[id].img;
        f.style.display = 'block';
    }

    function openScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
    </html>
