<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch | English Learning</title>
    <style>
        :root {
            --primary: #5865f2;
            --bg-light: #ffffff;
            --sidebar-bg: #f2f3f5;
            --text-dark: #2e3338;
            --border: #e3e5e8;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* --- KAYIT VE GİRİŞ EKRANI --- */
        #authScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border);
        }

        /* --- ANA UYGULAMA EKRANI --- */
        #mainApp {
            display: none; /* Başlangıçta gizli */
            height: 100vh;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 60px 1fr;
        }

        header {
            grid-column: 1 / 3;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .stats-group {
            display: flex;
            gap: 20px;
            font-weight: bold;
        }

        nav {
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .nav-item:hover { background: #e3e5e8; }

        .content-area {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- GÖRÜNTÜLÜ KONUŞMA EKRANI --- */
        .video-container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .video-box {
            background: #000;
            aspect-ratio: 4/3;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            width: 95%;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="auth-card" id="emailStep">
        <h2 style="color: var(--primary);">Join LangMatch</h2>
        <p>Enter your email to start learning</p>
        <input type="email" id="userEmail" placeholder="email@example.com">
        <button class="btn-primary" onclick="sendCode()">SEND VERIFICATION CODE</button>
    </div>

    <div class="auth-card" id="codeStep" style="display: none;">
        <h2 style="color: var(--primary);">Verify Your Email</h2>
        <p>We've sent a 6-digit code to your mail.</p>
        <input type="text" id="verifyCode" placeholder="000000" maxlength="6" style="text-align: center; letter-spacing: 5px;">
        <button class="btn-primary" onclick="verifyAndLogin()">VERIFY & LOGIN</button>
    </div>
</div>

<div id="mainApp">
    <header>
        <div class="logo"><b>LangMatch</b> <span style="font-size: 12px; color: grey;">developer</span></div>
        <div class="stats-group">
            <span title="Coins">💰 <span id="coinBalance">100</span></span>
            <span title="Level">🏆 Level <span id="userLevel">1</span></span>
        </div>
    </header>

    <nav>
        <div class="nav-item">🏠 Home</div>
        <div class="nav-item">🛒 Shop</div>
        <div class="nav-item">👤 Profile</div>
        <div class="nav-item">👥 Friends</div>
        <div class="nav-item">📝 Daily Quests</div>
    </nav>

    <main class="content-area">
        <h3>Video Chat</h3>
        <div class="video-container">
            <div class="video-box">
                <div class="video-label">You</div>
                </div>
            <div class="video-box" style="background: #e3e5e8; display: flex; align-items: center; justify-content: center;">
                <div class="video-label">Partner</div>
                <span style="color: #8e9297;">Waiting for match...</span>
            </div>
        </div>
        <button class="btn-primary" style="margin-top: 20px; width: 300px;">START NEXT MATCH</button>
    </main>
</div>

<script>
    function sendCode() {
        const email = document.getElementById('userEmail').value;
        if(email.includes("@")) {
            document.getElementById('emailStep').style.display = 'none';
            document.getElementById('codeStep').style.display = 'block';
        } else {
            alert("Please enter a valid email!");
        }
    }

    function verifyAndLogin() {
        // Kod simülasyonu (Gerçek sistemde backend'e gider)
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'grid';
    }
</script>

</body>
</html>
