<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Connect | Arena</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00d2ff; --gold: #f5af19; --red: #ff3b5c; --bg: #050a0f; --panel: rgba(15, 25, 35, 0.98); }
        body { font-family: 'Rajdhani', sans-serif; margin: 0; background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }
        
        /* --- MERKEZİ HİZALAMA SİSTEMİ --- */
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; padding-bottom: 80px; box-sizing: border-box; }
        .active-screen { display: flex !important; }

        /* --- KAYIT EKRANI (TAM ORTALANMIŞ) --- */
        .auth-card { width: 90%; max-width: 420px; padding: 30px; background: rgba(10, 20, 30, 0.8); border: 2px solid var(--neon); border-radius: 25px; box-shadow: 0 0 40px rgba(0, 210, 255, 0.2); backdrop-filter: blur(10px); }
        .input-box { background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 12px; padding: 12px; margin: 8px 0; width: 100%; color: #fff; box-sizing: border-box; font-family: inherit; }
        .input-box:focus { border-color: var(--neon); outline: none; }
        .btn-main { background: linear-gradient(90deg, #008cff, #00d2ff); border: none; padding: 16px; border-radius: 15px; width: 100%; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3); }

        /* --- DISCORD TARZI PROFİL --- */
        .profile-header { width: 100%; height: 120px; background: linear-gradient(to right, #00d2ff, #3a7bd5); border-radius: 20px 20px 0 0; position: relative; }
        .p-avatar-wrapper { position: absolute; bottom: -40px; left: 20px; }
        .p-avatar { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--bg); background: #222; }
        .p-frame { position: absolute; top: -5px; left: -5px; width: 90px; height: 90px; pointer-events: none; }
        .p-info { margin-top: 50px; padding: 20px; text-align: left; width: 100%; }

        /* --- GLOBAL CHAT --- */
        #chatBox { flex: 1; width: 95%; max-width: 500px; background: rgba(0,0,0,0.3); border-radius: 15px; overflow-y: auto; padding: 15px; margin-bottom: 10px; border: 1px solid #222; }
        .msg { margin-bottom: 8px; font-size: 14px; }
        .msg b { color: var(--neon); }

        /* --- NAVIGASYON --- */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: #0a0f15; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #222; }
        .nav-item { font-size: 22px; cursor: pointer; color: #555; transition: 0.3s; }
        .nav-item.active { color: var(--neon); transform: translateY(-5px); }
    </style>
</head>
<body>

    <div id="scrAuth" class="screen active-screen">
        <div class="auth-card">
            <h2 style="font-family:'Orbitron'; font-style:italic; margin-bottom:5px;">MACERAYA KATIL!</h2>
            <p style="color:#666; font-size:13px; margin-bottom:20px;">Kayıt ol ve rütbeni belirlemek için ilk adımı at.</p>
            <input type="text" id="uName" placeholder="👤 Kullanıcı Adı" class="input-box">
            <input type="email" id="uEmail" placeholder="📧 E-posta" class="input-box">
            <input type="password" id="uPass" placeholder="🔒 Şifre" class="input-box">
            <div style="display:flex; gap:10px;">
                <select id="uGender" class="input-box"><option>Cinsiyet</option><option>Erkek</option><option>Kadın</option></select>
                <input type="number" id="uAge" placeholder="🎂 Yaş" class="input-box">
            </div>
            <select id="uCountry" class="input-box">
                <option>Ülke Seç</option><option>Türkiye 🇹🇷</option><option>USA 🇺🇸</option><option>Germany 🇩🇪</option>
            </select>
            <button class="btn-main" onclick="handleAuth()">[ KAYIT OL ]</button>
            <p onclick="toggleLogin()" style="font-size:12px; margin-top:15px; color:var(--gold); cursor:pointer;">Zaten hesabın var mı? Giriş Yap</p>
        </div>
    </div>

    <div id="scrChat" class="screen">
        <h3 style="color:var(--neon)">GLOBAL ARENA CHAT</h3>
        <div id="chatBox"></div>
        <div style="width:95%; max-width:500px; display:flex; gap:5px;">
            <input type="text" id="chatInput" placeholder="Mesaj yaz..." class="input-box">
            <button class="btn-main" style="width:80px; margin:8px 0;" onclick="sendMsg()">GÖNDER</button>
        </div>
    </div>

    <div id="scrProfile" class="screen">
        <div class="auth-card" style="padding:0; overflow:hidden;">
            <div class="profile-header">
                <div class="p-avatar-wrapper">
                    <img id="pImg" src="https://via.placeholder.com/80" class="p-avatar">
                    <img id="currentFrame" src="" class="p-frame"> </div>
            </div>
            <div class="p-info">
                <h2 id="pName" style="margin:0">Kullanıcı Adı</h2>
                <p id="pBio" style="color:#888; font-size:14px; margin:5px 0;">Nexus Warrior | Durum açıklaması...</p>
                <div style="background:#111; padding:10px; border-radius:10px; margin-top:10px;">
                    <small style="color:var(--gold)">ENVANTER</small>
                    <div id="inventoryList" style="display:flex; gap:10px; margin-top:5px;">
                        <div style="width:40px; height:40px; border:1px dashed #333; border-radius:5px;"></div>
                    </div>
                </div>
                <button class="btn-main" style="background:var(--red); height:40px; padding:0;" onclick="logout()">ÇIKIŞ YAP</button>
            </div>
        </div>
    </div>

    <div class="nav-bottom">
        <div class="nav-item" onclick="switchTab('scrChat')">💬</div>
        <div class="nav-item active" onclick="switchTab('scrAuth')">🏠</div> <div class="nav-item" onclick="switchTab('scrProfile')">👤</div>
        <div class="nav-item" onclick="alert('Ayarlar Çok Yakında!')">⚙️</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        databaseURL: "https://nexus-b73be-default-rtdb.firebaseio.com",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let isLoginMode = false;

    // --- AUTH İŞLEMLERİ ---
    window.handleAuth = async () => {
        const email = document.getElementById('uEmail').value;
        const pass = document.getElementById('uPass').value;
        try {
            if(isLoginMode) {
                await signInWithEmailAndPassword(auth, email, pass);
            } else {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await set(ref(db, 'users/' + res.user.uid), {
                    username: document.getElementById('uName').value,
                    country: document.getElementById('uCountry').value,
                    bio: "Maceraya yeni katıldı!",
                    coins: 500, xp: 0, inventory: ["base_frame"]
                });
            }
        } catch(e) { alert("Hata: " + e.message); }
    };

    onAuthStateChanged(auth, user => {
        if(user) {
            switchTab('scrChat');
            loadProfile(user.uid);
            loadChat();
        } else {
            switchTab('scrAuth');
        }
    });

    window.logout = () => signOut(auth);

    // --- PROFİL & ENVANTER YÜKLEME ---
    function loadProfile(uid) {
        onValue(ref(db, 'users/' + uid), snap => {
            const data = snap.val();
            document.getElementById('pName').innerText = data.username;
            document.getElementById('pBio').innerText = data.bio;
            // Envanter listeleme ve çerçeve seçimi buraya eklenecek
        });
    }

    // --- GLOBAL CHAT SİSTEMİ ---
    window.sendMsg = () => {
        const text = document.getElementById('chatInput').value;
        if(!text) return;
        push(ref(db, 'globalChat'), {
            uid: auth.currentUser.uid,
            name: document.getElementById('pName').innerText,
            msg: text,
            time: Date.now()
        });
        document.getElementById('chatInput').value = "";
    };

    function loadChat() {
        onValue(ref(db, 'globalChat'), snap => {
            const box = document.getElementById('chatBox');
            box.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                box.innerHTML += `<div class="msg"><b>${m.name}:</b> ${m.msg}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    // --- EKRAN GEÇİŞLERİ ---
    window.switchTab = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active-screen');
    };

    window.toggleLogin = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('uName').style.display = isLoginMode ? 'none' : 'block';
        document.querySelector('.btn-main').innerText = isLoginMode ? '[ GİRİŞ YAP ]' : '[ KAYIT OL ]';
    };
</script>
</body>
</html>
