<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro | Developer</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --blue: #0095f6; --dark: #000; --card: #1c1c1e; --text: #fff; --green: #30d158; --yellow: #ffd60a; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--dark); color: var(--text); overflow: hidden; }
        
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex; }

        /* PROFESYONEL BUTONLAR */
        .btn-pro { background: var(--blue); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-pro:active { transform: scale(0.98); opacity: 0.8; }

        /* HEADER & NAV */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 0.5px solid #333; }
        .p-circle { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--blue); object-fit: cover; }

        /* WEPLAY GRID */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; flex: 1; overflow-y: auto; }
        .menu-item { border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #333; position: relative; }
        .badge { position: absolute; top: 10px; right: 10px; background: red; font-size: 10px; padding: 2px 6px; border-radius: 10px; }

        /* INSTAGRAM DM & CHAT */
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #000; }
        .msg { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 14px; }
        .msg.sent { align-self: flex-end; background: var(--blue); }
        .msg.received { align-self: flex-start; background: var(--card); }

        /* TELAFFUZ EĞİTİMİ */
        .word-card { background: var(--card); margin: 20px; padding: 40px; border-radius: 25px; text-align: center; border: 2px solid var(--blue); }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; background: var(--blue); border: none; font-size: 30px; color: white; cursor: pointer; margin-top: 20px; }
        .mic-active { animation: pulse 1.5s infinite; background: red; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div style="margin: auto; width: 85%; max-width: 350px; text-align: center;">
        <h1 style="letter-spacing: -1px; margin-bottom: 30px;">LangMatch</h1>
        <input type="text" id="authName" placeholder="Kullanıcı Adı" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; background:#1c1c1e; border:1px solid #333; color:white;">
        <input type="password" id="authPass" placeholder="Şifre" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; background:#1c1c1e; border:1px solid #333; color:white;">
        
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <select id="authGender" style="flex:1; padding:12px; border-radius:10px; background:#1c1c1e; color:white; border:1px solid #333;">
                <option value="Erkek">♂️ Erkek</option>
                <option value="Kız">♀️ Kız</option>
            </select>
            <select id="authCountry" style="flex:1; padding:12px; border-radius:10px; background:#1c1c1e; color:white; border:1px solid #333;">
                <option value="🇹🇷">Türkiye</option>
                <option value="🇺🇸">USA</option>
                <option value="🇩🇪">Germany</option>
            </select>
        </div>
        <button class="btn-pro" style="width: 100%;" onclick="handleAuth()">GİRİŞ / KAYIT</button>
    </div>
</div>

<div id="screenDash" class="screen">
    <div class="header">
        <img id="myAvatar" src="https://via.placeholder.com/100" class="p-circle" onclick="showScreen('screenProfile')">
        <div style="background:#1c1c1e; padding:5px 15px; border-radius:20px; font-weight:bold; color:var(--yellow);">💰 <span id="dashCoins">500</span></div>
        <div onclick="showScreen('screenFriends')" style="font-size:24px; cursor:pointer;">✉️</div>
    </div>
    
    <div style="margin:15px; background:linear-gradient(90deg, #6a11cb 0%, #2575fc 100%); padding:15px; border-radius:15px;">
        <small>🤖 DAILY QUEST</small>
        <div id="dailyTask" style="font-weight:bold; margin-top:5px;">Yükleniyor...</div>
    </div>

    <div class="menu-grid">
        <div class="menu-item" style="grid-column: span 2; background:#ff2d55;" onclick="showScreen('screenGlobalChat')">💬 GLOBAL CHAT <span class="badge">99+</span></div>
        <div class="menu-item" style="background:var(--green);" onclick="showScreen('screenMatchOptions')">📹 MATCHING</div>
        <div class="menu-item" style="background:var(--yellow); color:black;" onclick="showScreen('screenShop')">🛒 SHOP</div>
        <div class="menu-item" style="background:var(--blue);" onclick="showScreen('screenPronounce')">🗣️ TELAFFUZ</div>
        <div class="menu-item" style="background:#5856d6;" onclick="showScreen('screenSearch')">🔍 ÜYE ARA</div>
    </div>
</div>

<div id="screenPronounce" class="screen">
    <div class="header"><span onclick="showScreen('screenDash')">⬅️ Geri</span> <b>Telaffuz</b> <span></span></div>
    <div class="word-card">
        <h1 id="currentWord" style="font-size: 40px; margin: 0;">Apple</h1>
        <p style="color:gray;">Kelimeyi doğru telaffuz et!</p>
        <button id="micBtn" class="mic-btn" onclick="startSpeech()">🎤</button>
        <div id="speechResult" style="margin-top:20px; font-weight:bold;"></div>
    </div>
</div>

<div id="screenSearch" class="screen">
    <div class="header"><span onclick="showScreen('screenDash')">⬅️ Ara</span> <b>Üyeler</b> <span></span></div>
    <div style="padding:15px;">
        <input type="text" placeholder="Kullanıcı adı ara..." style="width:100%; padding:15px; border-radius:12px; background:#1c1c1e; border:1px solid #333; color:white;">
        <div style="margin-top:20px; background:var(--card); padding:15px; border-radius:15px; display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="https://via.placeholder.com/40" class="p-circle">
                <b>Developer_Suzan</b>
            </div>
            <button class="btn-pro" style="padding:5px 15px;" onclick="alert('İstek Gönderildi!')">Ekle</button>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let words = ["Apple", "Developer", "Success", "Language", "Matching", "Global", "Code", "System"];
    let wordIdx = 0;

    // AI GÜNLÜK GÖREV
    const tasks = [
        "Bugün 5 farklı kişiyle eşleş!",
        "Telaffuz modunda 3 kelime tamamla.",
        "Global Chat'te 'Merhaba' de.",
        "Profil resmini güncelle."
    ];

    function handleAuth() {
        const name = document.getElementById('authName').value;
        const pass = document.getElementById('authPass').value;
        const gender = document.getElementById('authGender').value;
        const country = document.getElementById('authCountry').value;

        if(!name || !pass) return alert("Boş bırakma!");

        // Güvenli Giriş Kayıt
        let user = JSON.parse(localStorage.getItem('u_' + name));
        if(user) {
            if(user.pass !== pass) return alert("Hatalı şifre!");
        } else {
            user = { name, pass, gender, country, coins: 500 };
            localStorage.setItem('u_' + name, JSON.stringify(user));
        }
        
        currentUser = user;
        document.getElementById('dailyTask').innerText = tasks[Math.floor(Math.random() * tasks.length)];
        showScreen('screenDash');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // TELAFFUZ SİSTEMİ
    function startSpeech() {
        const btn = document.getElementById('micBtn');
        const res = document.getElementById('speechResult');
        btn.classList.add('mic-active');
        
        // Simülasyon (Gerçek tarayıcı tanıma api'si için HTTPS gerekir)
        setTimeout(() => {
            btn.classList.remove('mic-active');
            const isCorrect = Math.random() > 0.3; // %70 ihtimalle doğru kabul et
            if(isCorrect) {
                res.innerHTML = "<span style='color:var(--green)'>✓ Mükemmel! +10 💰</span>";
                wordIdx++;
                setTimeout(() => {
                    document.getElementById('currentWord').innerText = words[wordIdx % words.length];
                    res.innerText = "";
                }, 1500);
            } else {
                res.innerHTML = "<span style='color:red'>× Tekrar Dene!</span>";
            }
        }, 2000);
    }

    // MATCHING HATALARI (AI FeedBack Simülasyonu)
    function showMatchError() {
        alert("AI Analizi: Görüşme sırasında çok fazla duraksadın. 'Language' kelimesini yanlış telaffuz ettin. Bir dahaki sefere daha akıcı olmaya çalış!");
    }
</script>

</body>
</html>
