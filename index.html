<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch | NEXUS CORE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #050505; --accent: #00f2ff; --gold: #ffcc00; --panel: rgba(20, 20, 25, 0.95); }
        body { font-family: 'Orbitron', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow: hidden; }
        
        /* OYUN HAVASI ARKA PLAN */
        .bg-effect { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #102a43 0%, #050505 100%); z-index: -1; }

        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; position: absolute; }
        .active { display: flex !important; }

        /* KAYIT EKRANI (REVOLUTION) */
        .auth-card { background: var(--panel); border: 2px solid var(--accent); border-radius: 30px; padding: 40px; width: 80%; max-width: 380px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); text-align: center; }
        .input-group { margin-bottom: 15px; width: 100%; }
        input, select { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; font-size: 16px; box-sizing: border-box; }
        
        .btn-action { background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); color: #fff; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(58, 123, 213, 0.4); margin-top: 10px; }
        
        /* ANA MENÜ (OYUN LOBİSİ) */
        .lobby-header { width: 100%; padding: 20px; display: flex; justify-content: space-between; position: fixed; top: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .match-btn { width: 250px; height: 250px; border-radius: 50%; background: rgba(0, 242, 255, 0.1); border: 4px solid var(--accent); color: var(--accent); font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(0, 242, 255, 0.3); }
        .match-btn:hover { transform: scale(1.05); background: var(--accent); color: #000; }

        /* GÖRÜNTÜLÜ EŞLEŞME ALANI */
        .video-box { width: 100%; height: 100%; position: relative; background: #000; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 120px; height: 160px; position: absolute; top: 20px; right: 20px; border: 2px solid var(--accent); border-radius: 15px; z-index: 10; background: #111; transform: scaleX(-1); }

        .ui-controls { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 20; }
        .btn-round { width: 70px; height: 70px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    </style>
</head>
<body>
    <div class="bg-effect"></div>

    <div id="screenAuth" class="screen active">
        <div class="auth-card">
            <h1 style="color:var(--accent); margin-bottom:30px;">NEXUS CORE</h1>
            <div class="input-group"><input type="email" id="email" placeholder="E-posta"></div>
            <div class="input-group"><input type="password" id="pass" placeholder="Şifre"></div>
            <div id="regFields" style="display:none">
                <div class="input-group"><input type="text" id="username" placeholder="Kullanıcı Adı"></div>
                <div class="input-group">
                    <select id="gender">
                        <option value="Erkek">Erkek</option>
                        <option value="Kadın">Kadın</option>
                    </select>
                </div>
            </div>
            <button class="btn-action" onclick="handleAuth()" id="btnAuth">GİRİŞ YAP</button>
            <p onclick="toggleAuth()" id="switchAuth" style="margin-top:20px; cursor:pointer; color:var(--gold); font-size:14px;">Hesabın yok mu? Kayıt Ol</p>
        </div>
    </div>

    <div id="screenLobby" class="screen">
        <div class="lobby-header">
            <div>👤 <b id="uName">...</b></div>
            <div style="color:var(--gold)">💰 <span id="uCoins">0</span></div>
        </div>
        <button class="match-btn" onclick="startMatching()">
            <span style="font-size:50px">📹</span><br>SAVAŞI BAŞLAT
        </button>
    </div>

    <div id="screenMatch" class="screen" style="padding:0">
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay muted playsinline></video>
            <div id="statusLabel" style="position:absolute; top:30px; left:30px; background:rgba(0,0,0,0.7); padding:10px 20px; border-radius:10px;">Aranıyor...</div>
            <div class="ui-controls">
                <button class="btn-round" style="background:var(--gold)" onclick="location.reload()">⏭️ PAS</button>
                <button class="btn-round" style="background:#ff3b5c" onclick="location.reload()">❌ ÇIK</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        storageBucket: "nexus-b73be.firebasestorage.app",
        messagingSenderId: "364035825759",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let isRegister = false;
    let peer = null;
    let localStream = null;

    window.toggleAuth = () => {
        isRegister = !isRegister;
        document.getElementById('regFields').style.display = isRegister ? 'block' : 'none';
        document.getElementById('btnAuth').innerText = isRegister ? 'KAYIT OL' : 'GİRİŞ YAP';
        document.getElementById('switchAuth').innerText = isRegister ? 'Giriş Yap' : 'Kayıt Ol';
    };

    window.handleAuth = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        try {
            if(isRegister) {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await set(ref(db, 'users/' + res.user.uid), {
                    username: document.getElementById('username').value,
                    gender: document.getElementById('gender').value,
                    coins: 500, xp: 0, status: "idle", peerId: ""
                });
            } else {
                await signInWithEmailAndPassword(auth, email, pass);
            }
        } catch(e) { alert(e.message); }
    };

    onAuthStateChanged(auth, user => {
        if(user) {
            onValue(ref(db, 'users/' + user.uid), snap => {
                const data = snap.val();
                document.getElementById('uName').innerText = data.username;
                document.getElementById('uCoins').innerText = data.coins;
                showScreen('screenLobby');
            });
        } else { showScreen('screenAuth'); }
    });

    // --- GERÇEK EŞLEŞME MOTORU ---
    window.startMatching = async () => {
        showScreen('screenMatch');
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVideo').srcObject = localStream;

        peer = new Peer(auth.currentUser.uid); // Sabit ID: Firebase UID
        
        peer.on('open', (id) => {
            update(ref(db, 'users/' + auth.currentUser.uid), { status: "searching", peerId: id });
            findPartner();
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', rs => {
                document.getElementById('remoteVideo').srcObject = rs;
                document.getElementById('statusLabel').innerText = "BAĞLANDI!";
            });
        });
    };

    async function findPartner() {
        const snap = await get(ref(db, 'users'));
        const users = snap.val();
        for(let id in users) {
            if(id !== auth.currentUser.uid && users[id].status === "searching") {
                const call = peer.call(users[id].peerId, localStream);
                call.on('stream', rs => {
                    document.getElementById('remoteVideo').srcObject = rs;
                    document.getElementById('statusLabel').innerText = "BAĞLANDI!";
                    update(ref(db, 'users/' + auth.currentUser.uid), { status: "busy" });
                    update(ref(db, 'users/' + id), { status: "busy" });
                });
                break;
            }
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
