<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch | Developer Edition</title>
    <style>
        :root {
            --discord-dark: #313338;
            --discord-gray: #2b2d31;
            --accent-blue: #5865f2;
            --gold: #ffcf4b;
        }

        body {
            background-color: var(--discord-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 90%;
            max-width: 450px;
            background: var(--discord-gray);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        .profile-section {
            border: 2px solid var(--accent-blue);
            padding: 15px;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }

        /* Avatar Çerçevesi Örneği */
        .premium-frame {
            border: 4px solid var(--gold) !important;
            box-shadow: 0 0 10px var(--gold);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            background: #1e1f22;
            color: white;
        }

        .btn-match {
            background-color: #248046;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #1e1f22;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .task-box {
            font-size: 12px;
            color: #b5bac1;
            background: #383a40;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="app-container" id="loginScreen">
    <div class="stats-bar">
        <span>💰 Coins: <b id="coinCount">100</b></span>
        <span>🏆 Level: 1</span>
    </div>

    <div class="profile-section" id="userAvatar">👤</div>
    
    <h2>Welcome to LangMatch</h2>
    <p>English Learning & Socializing</p>

    <input type="text" id="username" placeholder="Username...">
    <input type="number" id="age" placeholder="Your Age">
    
    <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
    </select>

    <hr style="border: 0.5px solid #4e5058; margin: 20px 0;">

    <label>Partner Preference:</label>
    <select id="pref-gender">
        <option value="any">Anyone</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
    </select>

    <button class="btn-match" onclick="startMatching()">START MATCHING</button>

    <div class="task-box">
        <b>Daily Quest:</b> <span id="dailyTask">Use 'Substantial' in a sentence today! (+50 Coins)</span>
    </div>
</div>

<script>
    let coins = 100;

    function startMatching() {
        const name = document.getElementById('username').value;
        if(!name) {
            alert("Please enter a username!");
            return;
        }
        alert("Searching for a partner who matches your preference...");
        // Burada WebRTC eşleşme mantığı başlayacak
    }

    // Basit Görev Sistemi
    const tasks = [
        "Say 'Hello' to 3 different people",
        "Talk for more than 5 minutes",
        "Learn 5 new words from the AI coach",
        "Send a gift to a new friend"
    ];

    document.getElementById('dailyTask').innerText = tasks[Math.floor(Math.random() * tasks.length)] + " (+50 Coins)";
</script>

</body>
</html>
