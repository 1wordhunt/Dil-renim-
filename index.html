<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v12</title>
    <style>
        :root {
            --bg: #0b0c10; --card: #1f2833; --text: #ffffff;
            --accent: #66fcf1; --gold: #f5af19; --diamond: #00d2ff;
            --neon-red: linear-gradient(135deg, #ff416c, #ff4b2b);
            --neon-green: linear-gradient(135deg, #00b09b, #96c93d);
            --neon-blue: linear-gradient(135deg, #2193b0, #6dd5ed);
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; background: var(--bg); }
        .active { display: flex !important; }

        /* Profil Paneli */
        .user-panel { background: #1a1a1d; margin: 15px; padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 2px solid var(--accent); position: relative; }
        .avatar-container { position: relative; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; }
        .u-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; position: absolute; z-index: 1; }
        .u-frame-v12 { width: 95px; height: 95px; position: absolute; z-index: 2; pointer-events: none; display: none; }
        
        /* Grid Menü */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px; flex: 1; overflow-y: auto; padding-bottom: 90px; }
        .card { border-radius: 20px; padding: 25px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; color: white; cursor: pointer; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; }
        .badge { position: absolute; top: 10px; right: 10px; background: red; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; }

        /* Navigasyon */
        .nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { font-size: 10px; color: #666; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--accent); }

        /* Dükkan */
        .shop-item { background: #25262e; margin: 10px 15px; padding: 15px; border-radius: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--gold); }
        .btn-claim { background: var(--gold); color: black; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-claim:disabled { background: #444; color: #888; }

        /* Global Chat - Heavy Mesaj Çerçevesi */
        .msg-frame-v13 { background: url('https://i.ibb.co/68vDqF6/transparent-Elite-V2.png') no-repeat center; background-size: cover; padding: 20px; border-radius: 15px; position: relative; margin-bottom: 15px; align-self: flex-start; max-width: 80%; }
        .msg-text-v13 { position: relative; z-index: 2; color: white; font-size: 14px; text-shadow: 0 0 5px var(--accent); }
        .me-v13 { align-self: flex-end; margin-left: auto; background-image: linear-gradient(135deg, #ff416c, #ff4b2b); }

        /* Ortak */
        .btn-action { background: var(--accent); color: black; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        input { width: 100%; padding: 15px; margin: 8px 0; border-radius: 12px; background: #1a1a1d; border: 1px solid #333; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div style="margin: auto; width: 85%; text-align: center;">
        <h1 style="color: var(--accent);">THE CORE: NEXUS</h1>
        <div onclick="document.getElementById('regFile').click()" style="cursor:pointer; margin-bottom: 20px;">
            <img id="regPreview" src="https://via.placeholder.com/100" style="width:100px; height:100px; border-radius:50%; border:3px solid var(--accent); object-fit: cover;">
        </div>
        <input type="file" id="regFile" style="display:none" onchange="previewFile(this)">
        <input type="text" id="regName" placeholder="Developer Adın">
        <input type="password" id="regPass" placeholder="Güçlü Şifren">
        <button class="btn-action" onclick="handleAuth()">EKOSİSTEME GİR</button>
    </div>
</div>

<div id="screenHome" class="screen">
    <div class="user-panel">
        <div class="avatar-container">
            <img id="uAvatar" src="" class="u-img">
            <img id="activeFrame" src="https://i.ibb.co/68vDqF6/transparent-Elite-V2.png" class="u-frame-v12">
        </div>
        <div style="flex:1">
            <div id="uName" style="font-weight:bold;">User</div>
            <div style="font-size:11px; color:var(--gold);">🏅 Altın Sarı - <span id="uXP">9480</span> XP</div>
        </div>
        <div style="text-align:right">
            <div style="color:var(--gold); font-weight:bold;">💰 <span id="uCoins">12500</span></div>
            <div style="color:var(--diamond); font-size:12px;">💎 350</div>
        </div>
    </div>
    <div class="grid">
        <div class="card" style="grid-column:span 2; background: #8b0000;" onclick="openScreen('screenGlobal')">
            <span class="badge">99+</span>
            💬 GLOBAL CHAT
        </div>
        <div class="card" style="background: #2e7d32;" onclick="openScreen('screenMatch')">📹 MATCHING</div>
        <div class="card" style="background: #f5af19;" onclick="openScreen('screenShop')">🛒 SHOP</div>
        <div class="card" style="background: #0277bd;" onclick="openScreen('screenPronounce')">🗣️ TELAFFUZ</div>
        <div class="card" style="background: #311b92;" onclick="openScreen('screenSearch')">🔍 ÜYE ARA</div>
    </div>
    <div class="nav">
        <div class="nav-item active" onclick="openScreen('screenHome')">🏠</div>
        <div class="nav-item" onclick="openScreen('screenShop')">🛒</div>
        <div class="nav-item" onclick="openScreen('screenTasks')">✅</div>
        <div class="nav-item" onclick="openScreen('screenProfile')">👤</div>
    </div>
</div>

<div id="screenShop" class="screen">
    <div class="user-panel"><span onclick="openScreen('screenHome')" style="cursor:pointer">⬅️</span> <b>NEXUS STORE</b></div>
    <div style="overflow-y:auto; flex:1;">
        <div class="shop-item">
            <img src="https://i.ibb.co/68vDqF6/transparent-Elite-V2.png" style="width:50px;">
            <div style="flex:1"><b>Nexus Elite Frame</b><br><small style="color:var(--gold)">VIP HAREKETLİ</small></div>
            <button class="btn-claim" onclick="alert('Satın alındı! Profilden tak kanka.')">BEDAVA</button>
        </div>
        <div class="shop-item">
            <img src="https://i.ibb.co/1230009968/transparent-Nexus-Chat-V13.png" style="width:50px; border-radius:5px;">
            <div style="flex:1"><b>Chat Starry Frame</b><br><small style="color:red">GLOBAL MESAJ İÇİN</small></div>
            <button class="btn-claim" onclick="buyChatFrame(this)">BEDAVA</button>
        </div>
    </div>
</div>

<div id="screenProfile" class="screen">
    <div class="user-panel"><span onclick="openScreen('screenHome')" style="cursor:pointer">⬅️</span> <b>PROFİL</b></div>
    <div style="text-align:center; padding:30px;">
        <div class="avatar-container" style="width:120px; height:120px; margin:auto;">
            <img id="pImg" src="" style="width:80px; height:80px; border-radius:50%; object-fit:cover; position:absolute;">
            <img id="pFrame" src="https://i.ibb.co/68vDqF6/transparent-Elite-V2.png" style="width:160px; height:160px; position:absolute; display:none;">
        </div>
        <h2 id="pNameDisp" style="margin-top:20px;">Burak (Dev)</h2>
        <div id="inventoryArea" style="margin-top:20px;">
            <button class="btn-action" onclick="toggleFrame()">ÇERÇEVEYİ AKTİF ET / KALDIR</button>
        </div>
        <button class="btn-action" style="background:red; margin-top:50px;" onclick="location.reload()">GÜVENLİ ÇIKIŞ</button>
    </div>
</div>

<div id="screenGlobal" class="screen">
    <div class="user-panel"><span onclick="openScreen('screenHome')" style="cursor:pointer">⬅️</span> <b>GLOBAL CHAT</b></div>
    <div style="flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column;" id="chatBox"></div>
    <div style="padding:15px; display:flex; gap:10px; background:#121212;">
        <input type="text" id="chatMsg" placeholder="Premium mesaj yaz..." style="margin:0;">
        <button class="btn-claim" style="background:var(--accent); border:none; padding:10px; border-radius:10px;" onclick="sendMsg()">➡️</button>
    </div>
</div>

<div id="screenMatch" class="screen"><div class="user-panel">Matching</div></div>
<div id="screenTasks" class="screen"><div class="user-panel">Tasks</div></div>
<div id="screenSearch" class="screen"><div class="user-panel">Search</div></div>

<script>
    let userData = { name: '', avatar: '', hasFrame: false, frameOn: false, hasChatFrame: false };

    function previewFile(input) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = e => { document.getElementById('regPreview').src = e.target.result; userData.avatar = e.target.result; };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function handleAuth() {
        const n = document.getElementById('regName').value.trim();
        const p = document.getElementById('regPass').value.trim();
        if(!n || !p) return alert("Eksiksiz gir kanka!");
        
        userData.name = n + " (Dev)";
        document.getElementById('uName').innerText = userData.name;
        document.getElementById('pNameDisp').innerText = userData.name;
        document.getElementById('uAvatar').src = userData.avatar || 'https://via.placeholder.com/100';
        document.getElementById('pImg').src = userData.avatar || 'https://via.placeholder.com/100';
        
        openScreen('screenHome');
    }

    function openScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // --- NEXUS STORE & ÇERÇEVE SİSTEMİ ---
    function toggleFrame() {
        userData.frameOn = !userData.frameOn;
        const s = userData.frameOn ? 'block' : 'none';
        document.getElementById('activeFrame').style.display = s;
        document.getElementById('pFrame').style.display = s;
    }

    function buyChatFrame(btn) {
        userData.hasChatFrame = true;
        btn.innerText = "AKTİF";
        btn.disabled = true;
        alert("Global Chat Premium Mesaj Çerçevesi aktif kanka!");
    }

    // --- GLOBAL CHAT & PREMİUM MESAJ ---
    function sendMsg() {
        const m = document.getElementById('chatMsg').value;
        if(!m) return;
        const box = document.getElementById('chatBox');
        
        if(userData.hasChatFrame) {
            // PREMIUM MESAJ (Görsel 13 baz alındı)
            box.innerHTML += `
                <div class="msg-frame-v13 me-v13">
                    <div class="msg-text-v13"><b>Sen:</b> ${m}</div>
                </div>`;
        } else {
            // NORMAL MESAJ
            box.innerHTML += `<div style="background:#333; padding:10px; border-radius:10px; margin-bottom:10px; width:fit-content; align-self:flex-end; margin-left:auto;"><b>Sen:</b> ${m}</div>`;
        }
        
        document.getElementById('chatMsg').value = '';
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
