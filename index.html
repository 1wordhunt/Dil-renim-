<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro | Kusursuz</title>
    <style>
        :root {
            --bg: #0f1015; --card: #1c1c1e; --text: #ffffff;
            --neon-red: linear-gradient(135deg, #ff416c, #ff4b2b);
            --neon-green: linear-gradient(135deg, #00b09b, #96c93d);
            --neon-blue: linear-gradient(135deg, #2193b0, #6dd5ed);
            --neon-yellow: linear-gradient(135deg, #f12711, #f5af19);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; top: 0; left: 0; background: var(--bg); }
        .active { display: flex !important; }
        
        /* UI Tasarımı */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--card); border-bottom: 1px solid #333; }
        .p-circle { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #f5af19; object-fit: cover; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; flex: 1; overflow-y: auto; padding-bottom: 90px; }
        .menu-btn { border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; border: none; cursor: pointer; color: white; }
        .btn-main { background: var(--neon-blue); padding: 15px; border-radius: 12px; border: none; color: white; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        /* Form Elemanları */
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; background: #25262e; border: 1px solid #444; color: white; box-sizing: border-box; font-size: 14px; }
        option { background: #1c1c1e; color: white; }

        .user-card { background: var(--card); margin: 8px 15px; padding: 12px; border-radius: 18px; display: flex; align-items: center; gap: 12px; border: 1px solid #333; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(20,20,25,0.98); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; z-index: 1000; }
        .nav-btn { font-size: 10px; text-align: center; color: #888; cursor: pointer; }
        .nav-btn.active { color: #00d2ff; }
    </style>
</head>
<body>

<div id="screenAuth" class="screen active">
    <div style="margin: auto; width: 85%; text-align: center;">
        <h1 style="background: var(--neon-blue); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px;">LangMatch Pro</h1>
        
        <div onclick="document.getElementById('regFile').click()" style="cursor:pointer; margin-bottom: 15px;">
            <img id="regPreview" src="https://via.placeholder.com/100" style="width:100px; height:100px; border-radius:50%; border:3px solid #f5af19; object-fit:cover;">
            <p style="font-size:12px; color:#f5af19; margin-top: 5px;">Fotoğraf Seç</p>
        </div>
        <input type="file" id="regFile" style="display:none" onchange="previewFile(this)">
        
        <input type="text" id="regName" placeholder="Kullanıcı Adı">
        
        <div style="display:flex; gap:10px;">
            <select id="regGender">
                <option value="Erkek">👨 Erkek</option>
                <option value="Kız">👩 Kız</option>
            </select>
            <select id="regCountry">
                <option value="TR">🇹🇷 Türkiye</option>
                <option value="US">🇺🇸 USA</option>
                <option value="DE">🇩🇪 Almanya</option>
                <option value="GB">🇬🇧 İngiltere</option>
            </select>
        </div>
        
        <button class="btn-main" onclick="handleRegister()">KAYIT OL VE BAŞLA</button>
    </div>
</div>

<div id="screenHome" class="screen">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="uAvatar" src="" class="p-circle" onclick="openScreen('screenProfile')">
            <div>
                <div id="uName" style="font-weight:bold; font-size:14px;">User</div>
                <div id="uDetail" style="font-size:10px; color:#aaa;">Türkiye | Erkek</div>
            </div>
        </div>
        <div style="color:#ffd60a; font-weight:bold;">💰 <span id="uCoins">0</span></div>
    </div>
    
    <div class="main-grid">
        <div class="menu-btn" style="grid-column:span 2; height:100px; background:var(--neon-red);" onclick="openScreen('screenGlobal')">💬 GLOBAL CHAT</div>
        <div class="menu-btn" style="height:140px; background:var(--neon-green);" onclick="openScreen('screenMatchOptions')">📹 MATCHING</div>
        <div class="menu-btn" style="height:140px; background:var(--neon-yellow);" onclick="openScreen('screenShop')">🛒 SHOP</div>
        <div class="menu-btn" style="height:140px; background:var(--neon-blue);" onclick="openScreen('screenPronounce')">🗣️ TELAFFUZ</div>
        <div class="menu-btn" style="height:140px; background:var(--card); border:1px solid #444;" onclick="openScreen('screenSearch')">🔍 ÜYE ARA</div>
    </div>

    <div class="nav-bar">
        <div class="nav-btn active" onclick="openScreen('screenHome')">🏠<br>HOME</div>
        <div class="nav-btn" onclick="openScreen('screenTasks')">✅<br>TASKS</div>
        <div class="nav-btn" onclick="openScreen('screenDMList')">📩<br>MESSAGES</div>
        <div class="nav-btn" onclick="openScreen('screenProfile')">👤<br>PROFILE</div>
    </div>
</div>

<div id="screenSearch" class="screen">
    <div class="header"><span onclick="openScreen('screenHome')">⬅️</span> <b>Üye Bul</b> <span></span></div>
    <div style="padding:15px;"><input type="text" id="searchInput" placeholder="İsim ara..." oninput="searchUsers()"></div>
    <div id="searchResults" style="overflow-y:auto; flex:1;"></div>
</div>

<div id="screenTasks" class="screen">
    <div class="header"><span onclick="openScreen('screenHome')">⬅️</span> <b>Görevler</b> <span></span></div>
    <div id="taskList" style="padding:10px;"></div>
</div>

<div id="screenMatchOptions" class="screen">
    <div class="header"><span onclick="openScreen('screenHome')">⬅️</span> <b>Eşleşme</b> <span></span></div>
    <div style="margin:auto; width:80%; display:flex; flex-direction:column; gap:15px;">
        <button class="btn-main" style="background:#ff416c;" onclick="alert('Kızlarla eşleşme aranıyor...')">Kızlarla Eşleş</button>
        <button class="btn-main" style="background:#2193b0;" onclick="alert('Erkeklerle eşleşme aranıyor...')">Erkeklerle Eşleş</button>
    </div>
</div>

<script>
    let userDatabase = [
        {name: 'Ece', gender: 'Kız', country: 'TR', img: 'https://i.pravatar.cc/150?u=ece'},
        {name: 'Can', gender: 'Erkek', country: 'TR', img: 'https://i.pravatar.cc/150?u=can'}
    ];

    let currentUser = { name: '', avatar: 'https://via.placeholder.com/100', coins: 0, gender: '', country: '' };

    function previewFile(input) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = e => {
                document.getElementById('regPreview').src = e.target.result;
                currentUser.avatar = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        if(!name) return alert("Lütfen ismini gir!");

        currentUser.name = name;
        currentUser.gender = document.getElementById('regGender').value;
        currentUser.country = document.getElementById('regCountry').value;

        // Veritabanına ekle
        userDatabase.push({ name: currentUser.name, gender: currentUser.gender, country: currentUser.country, img: currentUser.avatar });

        document.getElementById('uName').innerText = currentUser.name;
        document.getElementById('uDetail').innerText = `${currentUser.country} | ${currentUser.gender}`;
        document.getElementById('uAvatar').src = currentUser.avatar;

        generateTasks();
        openScreen('screenHome');
    }

    function openScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function searchUsers() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const res = document.getElementById('searchResults');
        res.innerHTML = '';
        userDatabase.filter(u => u.name.toLowerCase().includes(q)).forEach(u => {
            res.innerHTML += `
                <div class="user-card">
                    <img src="${u.img}" style="width:45px; height:45px; border-radius:50%">
                    <div style="flex:1">
                        <b>${u.name}</b><br>
                        <small style="color:#888">${u.country} | ${u.gender}</small>
                    </div>
                    <button onclick="alert('Eklendi!')" style="background:none; border:1px solid #2193b0; color:white; border-radius:8px; padding:5px;">➕</button>
                </div>`;
        });
    }

    function generateTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = `<div class="user-card" style="justify-content:space-between"><span>Profilini Tamamla</span><b style="color:#ffd60a">+50 💰</b></div>`;
    }
</script>
</body>
</html>
