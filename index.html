<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Connect | Final Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00d2ff; --gold: #f5af19; --red: #ff3b5c; --bg: #050a0f; --panel: rgba(15, 25, 35, 0.98); }
        body { font-family: 'Rajdhani', sans-serif; margin: 0; background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }
        
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; }
        .active-screen { display: flex !important; }

        /* --- KART RESİMLERİ --- */
        #btnShop { background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.ibb.co/zHQQpn06/dukkas.jpg'); }
        #btnMatch { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://i.ibb.co/zHQQpn06/match.jpg'); }
        #btnWords { background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.ibb.co/zHQQpn06/telaffuz.jpg'); }
        #btnBP { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.ibb.co/zHQQpn06/1777825427839-2.jpg'); }
        #btnDaily { background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.ibb.co/zHQQpn06/soru.jpg'); }
        #btnClans { background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.ibb.co/zHQQpn06/klan.jpg'); }

        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 95%; max-width: 500px; margin-top: 50px; }
        .menu-card { 
            background-size: cover; background-position: center; border: 1px solid #333; 
            border-radius: 15px; height: 105px; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-end; padding-bottom: 8px;
            cursor: pointer; transition: 0.3s; position: relative; overflow: hidden;
            text-shadow: 2px 2px 4px #000;
        }
        .menu-card:hover { border-color: var(--neon); transform: scale(1.05); }

        /* MODAL & UI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; align-items: center; justify-content: center; }
        .modal-content { background: var(--panel); border: 2px solid var(--neon); width: 90%; max-width: 450px; border-radius: 20px; padding: 20px; position: relative; text-align: center; max-height: 85vh; overflow-y: auto; }
        .close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: var(--red); z-index: 3100; font-weight: bold; }
        .btn-action { background: linear-gradient(90deg, #008cff, #00d2ff); border: none; padding: 12px; border-radius: 10px; width: 100%; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: 'Rajdhani'; }
        
        /* AUTH INPUTS */
        .auth-input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }

        .p-frame-box { position: relative; width: 120px; height: 120px; margin: 0 auto 15px; }
        .p-img-main { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .p-frame-img { position: absolute; top: -12%; left: -12%; width: 124%; height: 124%; pointer-events: none; }
    </style>
</head>
<body>

    <div id="scrAuth" class="screen active-screen">
        <div style="background:rgba(10,20,30,0.95); padding:25px; border-radius:20px; border:1px solid var(--neon); width:85%; max-width:380px;">
            <h2 style="text-align:center; font-family:'Orbitron'; color:var(--neon);">NEXUS KAYIT</h2>
            <input type="text" id="uName" class="auth-input" placeholder="Kullanıcı Adı">
            <input type="email" id="uEmail" class="auth-input" placeholder="E-posta">
            <input type="password" id="uPass" class="auth-input" placeholder="Şifre">
            <div style="display:flex; gap:10px;">
                <select id="uGender" class="auth-input" style="width:50%;"><option value="Erkek">Erkek</option><option value="Kız">Kız</option></select>
                <input type="number" id="uAge" class="auth-input" style="width:50%;" placeholder="Yaş">
            </div>
            <input type="text" id="uCountry" class="auth-input" placeholder="Ülke">
            <button class="btn-action" onclick="handleAuth()">GİRİŞ / KAYIT</button>
        </div>
    </div>

    <div id="scrLobby" class="screen">
        <div style="position:fixed; top:0; width:100%; padding:15px; display:flex; justify-content:space-between; background:rgba(0,0,0,0.8); z-index:100; box-sizing:border-box;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:40px; height:40px; position:relative;">
                    <img id="miniPImg" src="" style="width:100%; height:100%; border-radius:50%;">
                    <img id="miniFrame" src="" style="position:absolute; top:-12%; left:-12%; width:124%; height:124%;">
                </div>
                <div><b id="dispName">...</b><br><small style="color:var(--neon)">developer</small></div>
            </div>
            <div style="text-align:right">💰 <span id="dispCoins">0</span></div>
        </div>

        <div class="grid-container">
            <div id="btnShop" class="menu-card" style="grid-column: span 2;" onclick="openModal('modalShop')"><h4>DÜKKAN</h4></div>
            <div id="btnMatch" class="menu-card" style="grid-column: span 2;" onclick="openModal('modalMatchPref')"><h4>EŞLEŞME BAŞLAT</h4></div>
            <div id="btnWords" class="menu-card" onclick="openModal('modalWords')"><h4>TELAFFUZ AI</h4></div>
            <div id="btnBP" class="menu-card" onclick="openModal('modalBP')"><h4>BATTLE PASS</h4></div>
            <div id="btnDaily" class="menu-card" onclick="openModal('modalDaily')"><h4>GÜNLÜK SORU</h4></div>
            <div id="btnClans" class="menu-card" onclick="openModal('modalClans')"><h4>KLANLAR</h4></div>
            <div id="btnProfile" class="menu-card" style="grid-column: span 2; background-color:#111;" onclick="switchTab('scrProfile')"><h4>PROFİLİM</h4></div>
        </div>
    </div>

    <div id="modalShop" class="modal"><div class="modal-content"><span class="close-x" onclick="closeModal()">×</span><h2>DÜKKAN</h2><button class="btn-action" onclick="getFreeFrame()">BEDAVA ÇERÇEVE</button></div></div>
    
    <div id="modalMatchPref" class="modal"><div class="modal-content"><span class="close-x" onclick="closeModal()">×</span><h2>TERCİH YAP</h2><button class="btn-action" onclick="startMatching('Erkek')">Erkekler</button><button class="btn-action" style="background:#e91e63" onclick="startMatching('Kız')">Kızlar</button><button class="btn-action" style="background:#444" onclick="startMatching('Hepsi')">Fark Etmez</button></div></div>

    <div id="modalClans" class="modal"><div class="modal-content"><span class="close-x" onclick="closeModal()">×</span><h2>KLANLAR</h2>
        <input type="text" id="clanNameInput" class="auth-input" placeholder="Klan Adı">
        <input type="file" id="clanImgInput" accept="image/*" style="display:none;" onchange="handleClanImg(this)">
        <button class="btn-action" style="background:var(--gold); color:#000;" onclick="document.getElementById('clanImgInput').click()">LOGOYU GALERİDEN SEÇ</button>
        <button class="btn-action" onclick="createClan()">KLAN KUR</button>
        <div id="clanListArea" style="margin-top:20px;"></div>
    </div></div>

    <div id="scrProfile" class="screen">
        <div class="modal-content">
            <span class="close-x" onclick="switchTab('scrLobby')">×</span>
            <div class="p-frame-box">
                <img id="pImg" src="" class="p-img-main">
                <img id="pFrame" src="" class="p-frame-img">
            </div>
            <h2 id="profName">...</h2>
            <p id="profBio">... | ... | ...</p>
            <input type="file" id="pImgFile" accept="image/*" style="display:none;" onchange="uploadProfileImg(this)">
            <button class="btn-action" onclick="document.getElementById('pImgFile').click()">GALERİDEN RESİM DEĞİŞTİR</button>
            <button class="btn-action" style="background:var(--red)" onclick="logout()">ÇIKIŞ YAP</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, update, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOMFetzbB5EPLxd0UFwGvrrXKuLNcbqTY",
        authDomain: "nexus-b73be.firebaseapp.com",
        projectId: "nexus-b73be",
        databaseURL: "https://nexus-b73be-default-rtdb.firebaseio.com",
        appId: "1:364035825759:web:fc25365d33c0a7513ffbea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // --- TEMEL UI FONKSİYONLARI ---
    window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
    window.closeModal = () => { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); };
    window.switchTab = (id) => { 
        closeModal(); 
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); 
        document.getElementById(id).classList.add('active-screen'); 
    };

    // --- KAYIT & GİRİŞ ---
    window.handleAuth = async () => {
        const email = document.getElementById('uEmail').value;
        const pass = document.getElementById('uPass').value;
        const name = document.getElementById('uName').value;
        const gender = document.getElementById('uGender').value;
        const age = document.getElementById('uAge').value;
        const country = document.getElementById('uCountry').value;

        if(!email || !pass) return alert("E-posta ve Şifre zorunlu!");

        try {
            const res = await createUserWithEmailAndPassword(auth, email, pass);
            await set(ref(db, 'users/' + res.user.uid), {
                username: name, gender: gender, age: age, country: country, coins: 500, pImg: "", pFrame: ""
            });
        } catch {
            await signInWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
        }
    };

    onAuthStateChanged(auth, user => {
        if(user) {
            switchTab('scrLobby');
            onValue(ref(db, 'users/' + user.uid), s => {
                const d = s.val(); if(!d) return;
                window.uData = d;
                document.getElementById('dispName').innerText = d.username;
                document.getElementById('profName').innerText = d.username;
                document.getElementById('profBio').innerText = `${d.gender} | ${d.age} | ${d.country}`;
                document.getElementById('dispCoins').innerText = d.coins || 0;
                const img = d.pImg || "https://via.placeholder.com/120";
                document.getElementById('pImg').src = img;
                document.getElementById('miniPImg').src = img;
                document.getElementById('pFrame').src = d.pFrame || "";
                document.getElementById('miniFrame').src = d.pFrame || "";
            });
        } else { switchTab('scrAuth'); }
    });

    // --- RESİM YÜKLEME ---
    window.uploadProfileImg = (input) => {
        const reader = new FileReader();
        reader.onload = (e) => update(ref(db, 'users/' + auth.currentUser.uid), { pImg: e.target.result });
        reader.readAsDataURL(input.files[0]);
    };

    // --- KLAN SİSTEMİ ---
    let tempClanImg = "";
    window.handleClanImg = (input) => {
        const reader = new FileReader();
        reader.onload = (e) => tempClanImg = e.target.result;
        reader.readAsDataURL(input.files[0]);
    };

    window.createClan = () => {
        const cName = document.getElementById('clanNameInput').value;
        if(!cName) return alert("Klan adı gir!");
        const cRef = push(ref(db, 'clans'));
        set(cRef, { name: cName, img: tempClanImg, leader: auth.currentUser.uid });
        alert("Klan Başarıyla Kuruldu!");
    };

    onValue(ref(db, 'clans'), (s) => {
        const area = document.getElementById('clanListArea');
        area.innerHTML = "";
        const data = s.val();
        for(let id in data) {
            area.innerHTML += `<div style="background:#111; padding:10px; border-radius:10px; margin-bottom:5px; display:flex; align-items:center; justify-content:space-between;">
                <img src="${data[id].img}" style="width:30px; border-radius:50%; margin-right:10px;">
                <b>${data[id].name}</b>
                <button class="btn-action" style="width:auto; padding:5px 15px; margin:0;">Katıl</button>
            </div>`;
        }
    });

    // --- DİĞER ---
    window.getFreeFrame = () => update(ref(db, 'users/' + auth.currentUser.uid), { pFrame: "https://i.ibb.co/1p2WxFx/avatar-frame.png" });
    window.logout = () => signOut(auth);
</script>
</body>
</html>
