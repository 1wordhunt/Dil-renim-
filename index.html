<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangMatch Pro v15</title>
    <style>
        :root {
            --bg: #000000; --text: #ffffff; --accent: #66fcf1;
            --red: #ff3b5c; --green: #2ecc71; --yellow: #f1c40f;
            --blue: #3498db; --purple: #9b59b6; --gold: #f5af19;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; position: absolute; }
        .active { display: flex !important; }

        /* --- ÜST BAR (SADE) --- */
        .top-bar { padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .mini-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--blue); object-fit: cover; }
        .coin-tag { background: #1a1a1d; padding: 5px 15px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 14px; }

        /* --- ANA EKRAN BLOKLARI (TAM SENİN İSTEDİĞİN GİBİ) --- */
        .main-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .quest-banner { background: linear-gradient(90deg, #4e54c8, #8f94fb); padding: 15px; border-radius: 15px; font-size: 13px; font-weight: bold; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .block { border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; color: white; cursor: pointer; text-decoration: none; position: relative; min-height: 140px; }
        .block-large { grid-column: span 2; min-height: 180px; }
        .notif { position: absolute; top: 15px; right: 15px; background: white; color: red; font-size: 10px; padding: 2px 6px; border-radius: 10px; }

        /* --- DÜKKAN & PROFİL SİSTEMİ --- */
        .shop-list { padding: 15px; }
        .item-card { background: #1a1a1d; border-radius: 15px; padding: 15px; margin-bottom: 10px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .btn-buy { background: var(--accent); color: black; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Avatar & Çerçeve */
        .big-avatar-area { position: relative; width: 120px; height: 120px; margin: 30px auto; display: flex; align-items: center; justify-content: center; }
        .main-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; z-index: 1; }
        .frame-img { position: absolute; width: 130px; height: 130px; z-index: 2; pointer-events: none; display: none; }
    </style>
</head>
<body>

<div id="screenHome" class="screen active">
    <div class="top-bar">
        <div class="user-info">
            <img id="headAvatar" src="https://via.placeholder.com/50" class="mini-avatar" onclick="openScreen('screenProfile')">
            <span id="uName">Dev</span>
        </div>
        <div class="coin-tag">💰 <span id="coinCount">12500</span></div>
    </div>

    <div class="main-container">
        <div class="quest-banner">🤖 DAILY QUEST<br>Bugün 5 farklı kişiyle eşleş!</div>
        
        <div class="block block-large" style="background: var(--red);" onclick="openScreen('screenGlobal')">
            <span class="notif">99+</span>
            💬 GLOBAL CHAT
        </div>

        <div class="grid-layout">
            <div class="block" style="background: var(--green);">📹 MATCHING</div>
            <div class="block" style="background: var(--yellow);" onclick="openScreen('screenShop')">🛒 SHOP</div>
            <div class="block" style="background: var(--blue);">🗣️ TELAFFUZ</div>
            <div class="block" style="background: var(--purple);" onclick="openScreen('screenSearch')">🔍 ÜYE ARA</div>
        </div>
    </div>
</div>

<div id="screenShop" class="screen">
    <div class="top-bar"><span onclick="openScreen('screenHome')">⬅️ Geri</span> <b>NEXUS MARKET</b></div>
    <div class="shop-list">
        <div class="item-card">
            <div><b>Elite Frame</b><br><small>Görsel 1'i yükle</small></div>
            <input type="file" id="upF" style="display:none" onchange="loadRes(this, 'frame')">
            <button class="btn-buy" onclick="document.getElementById('upF').click()">YÜKLE & AL</button>
        </div>
        <div class="item-card">
            <div><b>Chat Box</b><br><small>Görsel 2'yi yükle</small></div>
            <input type="file" id="upC" style="display:none" onchange="loadRes(this, 'chat')">
            <button class="btn-buy" onclick="document.getElementById('upC').click()">YÜKLE & AL</button>
        </div>
        <div class="item-card">
            <div><b>🔥 Voice Cloning</b><br><small>10.000 Coin</small></div>
            <button class="btn-buy">SATIN AL</button>
        </div>
    </div>
</div>

<div id="screenProfile" class="screen">
    <div class="top-bar"><span onclick="openScreen('screenHome')">⬅️ Geri</span> <b>PROFİL</b></div>
    <div class="big-avatar-area">
        <img id="pImg" src="https://via.placeholder.com/100" class="main-img">
        <img id="pFrame" src="" class="frame-img">
    </div>
    <div style="text-align:center; padding:20px;">
        <h3 id="pNameDisp">Developer</h3>
        <input type="file" id="upA" style="display:none" onchange="loadRes(this, 'avatar')">
        <button class="btn-buy" onclick="document.getElementById('upA').click()">RESMİ DEĞİŞTİR</button>
        <br><br>
        <button class="btn-buy" style="background:var(--green)" onclick="toggleF()">ÇERÇEVEYİ TAK / ÇIKAR</button>
    </div>
</div>

<div id="screenGlobal" class="screen"><div class="top-bar"><span onclick="openScreen('screenHome')">⬅️</span> Chat</div></div>
<div id="screenSearch" class="screen"><div class="top-bar"><span onclick="openScreen('screenHome')">⬅️</span> Üye Bul</div></div>

<script>
    let storage = { frame: '', chat: '' };

    function loadRes(input, type) {
        if (input.files && input.files[0]) {
            let r = new FileReader();
            r.onload = e => {
                if(type==='avatar') { 
                    document.getElementById('pImg').src = e.target.result;
                    document.getElementById('headAvatar').src = e.target.result;
                }
                if(type==='frame') { 
                    storage.frame = e.target.result;
                    document.getElementById('pFrame').src = e.target.result;
                    alert("Çerçeve yüklendi!");
                }
            };
            r.readAsDataURL(input.files[0]);
        }
    }

    function toggleF() {
        const f = document.getElementById('pFrame');
        f.style.display = (f.style.display === 'block') ? 'none' : 'block';
    }

    function openScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
